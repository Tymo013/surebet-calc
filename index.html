<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 24px 20px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.2rem; color: #00c853; margin-bottom: 4px; }
    .match { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* TABLE */
    .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 420px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    /* leg row */
    .leg-num {
      font-size: 0.75rem; color: #aaa;
      width: 20px; text-align: right; padding-right: 4px;
    }
    .odds-wrap { display: flex; align-items: center; gap: 3px; }
    .odds-btn {
      background: #0f3460; border: 1px solid #2a2a5a; color: #aaa;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .odds-btn:hover { border-color: #00c853; color: #00c853; }

    input[type="number"] {
      background: #0f3460; border: 1px solid #2a2a5a; color: #fff;
      border-radius: 6px; padding: 5px 6px; font-size: 0.85rem;
      outline: none; transition: border .2s; -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: #00c853; }
    .odds-input { width: 72px; }
    .stake-input { width: 80px; text-align: right; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    /* D / F columns */
    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #00c853;
    }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 70px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos { color: #00c853; font-weight: 600; }
    .profit-neg { color: #ff5555; }
    .profit-zero { color: #888; }

    /* separator */
    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }

    /* total row */
    .total-label {
      font-size: 0.78rem; color: #aaa; text-align: right;
      padding-right: 4px; font-weight: 600;
    }

    /* remove leg */
    .remove-btn {
      background: none; border: none; color: #ff5555;
      cursor: pointer; font-size: 1rem; padding: 0 3px; opacity: .6;
    }
    .remove-btn:hover { opacity: 1; }

    /* add leg */
    .add-leg {
      margin-top: 14px; background: none; border: 1px dashed #444;
      color: #aaa; width: 100%; padding: 7px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; }

    /* summary */
    .summary {
      margin-top: 16px; background: #0f3460;
      border-radius: 10px; padding: 14px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label { font-size: 0.68rem; color: #888; margin-bottom: 3px; }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    /* tooltip */
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }
    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }

    /* Mobile */
    @media (max-width: 500px) {
      body { padding: 12px 8px; }
      .card { padding: 16px 12px; border-radius: 12px; }
      h1 { font-size: 1.05rem; }
      .match { font-size: 0.78rem; }
      .market { font-size: 0.72rem; }
      .odds-input { width: 58px; }
      .stake-input { width: 68px; }
      .col-profit { width: 58px; font-size: 0.78rem; }
      .summary { gap: 8px; padding: 12px; }
      .sum-value { font-size: 0.95rem; }
      .sum-item { min-width: 70px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="matchLabel"></div>
  <div class="market" id="marketLabel"></div>

  <div class="table-wrap">
  <table class="calc-table">
    <thead>
      <tr>
        <th style="width:20px"></th>
        <th class="left" style="min-width:80px">Odds</th>
        <th style="min-width:90px">Inzet</th>
        <th style="width:18px"></th>
        <th class="col-d">
          <div class="th-icon">D <span class="tip" title="Distribute: herbereken automatisch bij wijziging">?</span></div>
        </th>
        <th class="col-f">
          <div class="th-icon">F <span class="tip" title="Fixed: houd deze inzet vast bij herberekening">?</span></div>
        </th>
        <th class="col-profit">Winst</th>
        <th style="width:22px"></th>
      </tr>
    </thead>
    <tbody id="legsBody"></tbody>
    <tbody>
      <tr class="sep">
        <td colspan="2" class="total-label">Totale inzet:</td>
        <td>
          <input type="number" class="stake-input" id="totalStake" value="100" min="0" step="1">
        </td>
        <td class="currency">EUR</td>
        <td class="col-d">
          <input type="checkbox" id="totalD" checked title="Herverdeel totaal over legs">
        </td>
        <td class="col-f">
          <input type="radio" name="fixed" value="total" id="totalF">
        </td>
        <td class="col-profit" id="totalProfit">—</td>
        <td></td>
      </tr>
    </tbody>
  </table>
  </div>

  <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>

  <div class="summary" id="summary"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let legs = [];
let fixedTarget = 'total'; // 'total' | index (number)

// ── URL params ────────────────────────────────────────────
function parseURL() {
  const p = new URLSearchParams(window.location.search);
  const match = p.get('match');
  if (match) document.getElementById('matchLabel').textContent = decodeURIComponent(match);

  const market = p.get('market');
  if (market) document.getElementById('marketLabel').textContent = '📊 ' + decodeURIComponent(market);

  const stake = p.get('stake');
  if (stake) document.getElementById('totalStake').value = stake;

  const oddsStr   = p.get('odds');
  const labelsStr = p.get('labels');
  const bmsStr    = p.get('bms');

  if (oddsStr) {
    const odds   = oddsStr.split(',');
    const labels = labelsStr ? decodeURIComponent(labelsStr).split('|') : [];
    const bms    = bmsStr    ? decodeURIComponent(bmsStr).split('|')    : [];
    legs = odds.map((o, i) => ({
      odds:      parseFloat(o) || 2.0,
      label:     labels[i] || `Uitkomst ${i + 1}`,
      bookmaker: bms[i]    || '',
      stake:     0,
      fixed:     false,
    }));
  } else {
    legs = [
      { odds: 2.0, label: 'Uitkomst 1', bookmaker: '', stake: 0, fixed: false },
      { odds: 2.0, label: 'Uitkomst 2', bookmaker: '', stake: 0, fixed: false },
    ];
  }

  renderLegs();
  calculate();
}

// ── Add / remove ──────────────────────────────────────────
function addLeg() {
  legs.push({ odds: 2.0, label: `Uitkomst ${legs.length + 1}`, bookmaker: '', stake: 0, fixed: false });
  renderLegs();
  calculate();
}

function removeLeg(i) {
  legs.splice(i, 1);
  if (fixedTarget === i) fixedTarget = 'total';
  else if (typeof fixedTarget === 'number' && fixedTarget > i) fixedTarget--;
  renderLegs();
  calculate();
}

// ── Render ────────────────────────────────────────────────
function renderLegs() {
  const tbody = document.getElementById('legsBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const desc = [leg.bookmaker, leg.label].filter(Boolean).join(' — ');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="leg-num">${i + 1}</td>
      <td>
        <div class="odds-wrap">
          <button class="odds-btn" onclick="changeOdds(${i},-0.01)" tabindex="-1">−</button>
          <input type="number" class="odds-input" id="odds_${i}" value="${leg.odds.toFixed(2)}"
            min="1.01" step="0.01" onchange="setOdds(${i}, this.value)" oninput="setOdds(${i}, this.value)">
          <button class="odds-btn" onclick="changeOdds(${i},+0.01)" tabindex="-1">+</button>
        </div>
        <div style="font-size:0.65rem;color:#666;margin-top:2px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
             title="${desc}">${desc}</div>
      </td>
      <td>
        <input type="number" class="stake-input" id="stake_${i}" value="${leg.stake}"
          min="0" step="1" onchange="setStake(${i}, this.value)" oninput="setStake(${i}, this.value)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d">
        <input type="checkbox" checked disabled title="Distribute actief">
      </td>
      <td class="col-f">
        <input type="radio" name="fixed" value="${i}" ${fixedTarget === i ? 'checked' : ''}
          onchange="setFixed(${i})">
      </td>
      <td class="col-profit" id="profit_${i}">—</td>
      <td>
        ${legs.length > 2 ? `<button class="remove-btn" onclick="removeLeg(${i})" title="Verwijder leg">×</button>` : ''}
      </td>
    `;
    tbody.appendChild(row);
  });

  // sync fixed radio
  const totalRadio = document.getElementById('totalF');
  if (fixedTarget === 'total') {
    totalRadio.checked = true;
  }
}

// ── Input handlers ────────────────────────────────────────
function setFixed(i) {
  fixedTarget = i;
  calculate();
}

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('totalF').addEventListener('change', () => {
    fixedTarget = 'total';
    calculate();
  });
  document.getElementById('totalStake').addEventListener('input', () => {
    if (fixedTarget === 'total') calculate();
    else {
      const v = parseFloat(document.getElementById('totalStake').value);
      if (!isNaN(v)) calculate();
    }
  });
  document.getElementById('totalD').addEventListener('change', calculate);
});

function changeOdds(i, delta) {
  legs[i].odds = Math.max(1.01, Math.round((legs[i].odds + delta) * 100) / 100);
  document.getElementById(`odds_${i}`).value = legs[i].odds.toFixed(2);
  calculate();
}

function setOdds(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v >= 1.01) legs[i].odds = v;
  calculate();
}

function setStake(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v >= 0) {
    legs[i].stake = v;
    legs[i].fixed = true;
    fixedTarget = i;
    // sync radio
    const r = document.querySelector(`input[type="radio"][value="${i}"]`);
    if (r) r.checked = true;
    calculateFromFixedLeg(i);
  }
}

// ── Calculate ─────────────────────────────────────────────
function calculate() {
  if (fixedTarget === 'total') {
    calculateFromTotal();
  } else if (typeof fixedTarget === 'number') {
    calculateFromFixedLeg(fixedTarget);
  }
}

function calculateFromTotal() {
  const total = parseFloat(document.getElementById('totalStake').value) || 0;
  const impliedSum = legs.reduce((s, l) => s + 1 / l.odds, 0);

  legs.forEach((leg, i) => {
    const raw = (1 / leg.odds) / impliedSum * total;
    leg.stake = Math.round(raw); // afronden naar hele euro's
  });

  // Zorg dat totaal klopt na afronden
  const roundedTotal = legs.reduce((s, l) => s + l.stake, 0);
  if (roundedTotal !== Math.round(total) && legs.length > 0) {
    const diff = Math.round(total) - roundedTotal;
    legs[0].stake += diff;
  }

  updateUI(total);
}

function calculateFromFixedLeg(idx) {
  const fixedStake = legs[idx].stake;
  const fixedOdds  = legs[idx].odds;
  const targetPayout = fixedStake * fixedOdds;

  legs.forEach((leg, i) => {
    if (i !== idx) {
      leg.stake = Math.round(targetPayout / leg.odds);
    }
  });

  const total = legs.reduce((s, l) => s + l.stake, 0);
  document.getElementById('totalStake').value = total;
  updateUI(total);
}

function updateUI(total) {
  const minPayout = Math.min(...legs.map(l => l.stake * l.odds));
  const profit    = minPayout - total;
  const profitPct = total > 0 ? (profit / total * 100) : 0;

  legs.forEach((leg, i) => {
    const inp = document.getElementById(`stake_${i}`);
    if (inp) inp.value = leg.stake;

    const legProfit = leg.stake * leg.odds - total;
    const profEl = document.getElementById(`profit_${i}`);
    if (profEl) {
      profEl.textContent = legProfit >= 0
        ? `+€${legProfit.toFixed(2)}`
        : `-€${Math.abs(legProfit).toFixed(2)}`;
      profEl.className = 'col-profit ' + (legProfit > 0 ? 'profit-pos' : legProfit < 0 ? 'profit-neg' : 'profit-zero');
    }
  });

  // Total profit cell
  const totalProfitEl = document.getElementById('totalProfit');
  if (totalProfitEl) {
    totalProfitEl.textContent = profit >= 0
      ? `+€${profit.toFixed(2)}`
      : `-€${Math.abs(profit).toFixed(2)}`;
    totalProfitEl.className = 'col-profit ' + (profit > 0 ? 'profit-pos' : profit < 0 ? 'profit-neg' : 'profit-zero');
  }

  // Summary
  const isSure = profit > 0;
  document.getElementById('summary').innerHTML = `
    <div class="sum-item">
      <div class="sum-label">Totale inzet</div>
      <div class="sum-value sum-white">€${total.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white">€${minPayout.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winst</div>
      <div class="sum-value ${isSure ? 'sum-green' : 'sum-red'}">
        ${profit >= 0 ? '+' : ''}€${profit.toFixed(2)}
      </div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Rendement</div>
      <div class="sum-value ${isSure ? 'sum-green' : 'sum-red'}">
        ${profitPct >= 0 ? '+' : ''}${profitPct.toFixed(2)}%
      </div>
    </div>
  `;
}

// ── Init ──────────────────────────────────────────────────
parseURL();
</script>
</body>
</html>
