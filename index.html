<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    .odds-wrap { display: flex; align-items: center; gap: 3px; }
    .odds-btn {
      background: #0f3460; border: 1px solid #2a2a5a; color: #aaa;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .odds-btn:hover { border-color: #00c853; color: #00c853; }

    input[type="number"] {
      background: #0f3460; border: 1px solid #2a2a5a; color: #fff;
      border-radius: 6px; padding: 5px 6px; font-size: 0.85rem;
      outline: none; transition: border .2s; -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: #00c853; }
    .odds-input  { width: 72px; }
    .stake-input { width: 80px; text-align: right; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #00c853; }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 72px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .remove-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 1rem; padding: 0 3px; opacity: .6; }
    .remove-btn:hover { opacity: 1; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0f3460;
      border: 1px solid #2a2a5a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .leg-card-title { font-size: 0.8rem; color: #aaa; font-weight: 600; }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 8px;
    }
    .leg-card-label { font-size: 0.72rem; color: #888; width: 48px; flex-shrink: 0; }
    .leg-card-row input[type="number"] { flex: 1; }

    .df-row {
      display: flex; gap: 16px; align-items: center; margin-bottom: 4px;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input { width: 16px; height: 16px; accent-color: #00c853; cursor: pointer; }
    .df-item input[type="radio"] { accent-color: #2196f3; }

    /* Total card op mobiel */
    .total-card {
      background: #0f3460;
      border: 1px solid #2a2a5a;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 10px;
    }
    .total-card-title { font-size: 0.8rem; color: #aaa; font-weight: 600; margin-bottom: 10px; }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .total-card-label { font-size: 0.72rem; color: #888; width: 80px; flex-shrink: 0; }

    /* Add leg */
    .add-leg {
      margin-top: 12px; background: none; border: 1px dashed #444;
      color: #aaa; width: 100%; padding: 7px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; }

    /* Summary */
    .summary {
      margin-top: 14px; background: #0f3460;
      border-radius: 10px; padding: 14px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label { font-size: 0.68rem; color: #888; margin-bottom: 3px; }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    /* ── BREAKPOINT ── */
    @media (max-width: 600px) {
      body { padding: 10px 8px; }
      .card { padding: 14px 12px; border-radius: 12px; }
      .desktop-view { display: none !important; }
      .mobile-view  { display: block !important; }
      h1 { font-size: 1rem; }
      .match  { font-size: 0.78rem; }
      .market { font-size: 0.72rem; }
      .summary { gap: 8px; padding: 12px; }
      .sum-value { font-size: 0.92rem; }
      .sum-item { min-width: 60px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match"  id="matchLabel"></div>
  <div class="market" id="marketLabel"></div>

  <!-- ══ DESKTOP VIEW ══ -->
  <div class="desktop-view">
    <div class="table-wrap">
    <table class="calc-table">
      <thead>
        <tr>
          <th style="width:20px"></th>
          <th class="left" style="min-width:80px">Odds</th>
          <th style="min-width:90px">Inzet</th>
          <th style="width:18px"></th>
          <th class="col-d"><div class="th-icon">D <span class="tip" title="Distribute: herbereken automatisch bij wijziging">?</span></div></th>
          <th class="col-f"><div class="th-icon">F <span class="tip" title="Fixed: houd deze inzet vast bij herberekening">?</span></div></th>
          <th class="col-profit">Winst</th>
          <th style="width:22px"></th>
        </tr>
      </thead>
      <tbody id="legsBody"></tbody>
      <tbody>
        <tr class="sep">
          <td colspan="2" class="total-label">Totale inzet:</td>
          <td><input type="number" class="stake-input" id="totalStake" value="100" min="0" step="1"></td>
          <td class="currency">EUR</td>
          <td class="col-d"><input type="checkbox" id="totalD" checked title="Herverdeel totaal over legs"></td>
          <td class="col-f"><input type="radio" name="fixed" value="total" id="totalF"></td>
          <td class="col-profit" id="totalProfit">—</td>
          <td></td>
        </tr>
      </tbody>
    </table>
    </div>
    <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>
  </div>

  <!-- ══ MOBILE VIEW ══ -->
  <div class="mobile-view">
    <div id="mobileLegs"></div>

    <!-- Totaal card -->
    <div class="total-card">
      <div class="total-card-title">Totale inzet</div>
      <div class="total-card-row">
        <span class="total-card-label">Inzet (EUR)</span>
        <input type="number" class="stake-input" id="totalStakeMob" value="100" min="0" step="1" style="flex:1;" oninput="syncTotal('mob')">
      </div>
      <div class="df-row" style="margin-top:4px;">
        <label class="df-item">
          <input type="checkbox" id="totalDMob" checked onchange="syncDTotal('mob')"> D
          <span class="tip" title="Distribute: herbereken automatisch">?</span>
        </label>
        <label class="df-item">
          <input type="radio" name="fixedMob" value="total" id="totalFMob" onchange="syncFixedMob('total')"> F
          <span class="tip" title="Fixed: houd totaal vast">?</span>
        </label>
        <span id="totalProfitMob" style="margin-left:auto;font-size:0.85rem;color:#888;">—</span>
      </div>
    </div>
    <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>
  </div>

  <div class="summary" id="summary"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let legs = [];
let fixedTarget = 'total';

// ── URL params ────────────────────────────────────────────
function parseURL() {
  const p = new URLSearchParams(window.location.search);
  const match = p.get('match');
  if (match) document.getElementById('matchLabel').textContent = decodeURIComponent(match);
  const market = p.get('market');
  if (market) document.getElementById('marketLabel').textContent = '📊 ' + decodeURIComponent(market);
  const stake = p.get('stake');
  if (stake) {
    document.getElementById('totalStake').value = stake;
    document.getElementById('totalStakeMob').value = stake;
  }
  const oddsStr   = p.get('odds');
  const labelsStr = p.get('labels');
  const bmsStr    = p.get('bms');
  if (oddsStr) {
    const odds   = oddsStr.split(',');
    const labels = labelsStr ? decodeURIComponent(labelsStr).split('|') : [];
    const bms    = bmsStr    ? decodeURIComponent(bmsStr).split('|')    : [];
    legs = odds.map((o, i) => ({
      odds:      parseFloat(o) || 2.0,
      label:     labels[i] || `Uitkomst ${i + 1}`,
      bookmaker: bms[i]    || '',
      stake:     0,
      fixed:     false,
    }));
  } else {
    legs = [
      { odds: 2.0, label: 'Uitkomst 1', bookmaker: '', stake: 0, fixed: false },
      { odds: 2.0, label: 'Uitkomst 2', bookmaker: '', stake: 0, fixed: false },
    ];
  }
}

// ── Add / remove leg ──────────────────────────────────────
function addLeg() {
  legs.push({ odds: 2.0, label: `Uitkomst ${legs.length + 1}`, bookmaker: '', stake: 0, fixed: false });
  recalc();
  renderAll();
}
function removeLeg(i) {
  if (legs.length <= 2) return;
  legs.splice(i, 1);
  if (fixedTarget >= legs.length) fixedTarget = 'total';
  recalc();
  renderAll();
}

// ── Recalc ────────────────────────────────────────────────
function totalStakeVal() {
  return parseFloat(document.getElementById('totalStake').value) || 0;
}

function recalc() {
  const total = totalStakeVal();
  const impliedSum = legs.reduce((s, l) => s + (l.odds > 1 ? 1 / l.odds : 0), 0);

  if (fixedTarget === 'total') {
    legs.forEach(l => {
      const raw = l.odds > 1 ? (1 / l.odds / impliedSum) * total : 0;
      l.stake = Math.round(raw);
    });
  } else {
    const fi = fixedTarget;
    const fixedStake = legs[fi]?.stake || 0;
    const fixedOdds  = legs[fi]?.odds  || 2;
    const fixedPayout = fixedStake * fixedOdds;
    legs.forEach((l, i) => {
      if (i === fi) return;
      const raw = l.odds > 1 ? fixedPayout / l.odds : 0;
      l.stake = Math.round(raw);
    });
    // Update total display
    const newTotal = legs.reduce((s, l) => s + l.stake, 0);
    document.getElementById('totalStake').value    = newTotal;
    document.getElementById('totalStakeMob').value = newTotal;
  }
}

function getProfitForLeg(i) {
  const payout = legs[i].stake * legs[i].odds;
  const totalIn = legs.reduce((s, l) => s + l.stake, 0);
  return payout - totalIn;
}

function getMinProfit() {
  const totalIn = legs.reduce((s, l) => s + l.stake, 0);
  const minPayout = Math.min(...legs.map(l => l.stake * l.odds));
  return minPayout - totalIn;
}

function profitClass(v) {
  if (v > 0.01)  return 'profit-pos';
  if (v < -0.01) return 'profit-neg';
  return 'profit-zero';
}
function profitStr(v) { return (v >= 0 ? '+' : '') + v.toFixed(2); }

// ── Render desktop ────────────────────────────────────────
function renderDesktop() {
  const tbody = document.getElementById('legsBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const tr = document.createElement('tr');
    const profit = getProfitForLeg(i);
    const bm = leg.bookmaker ? `<span style="font-size:.68rem;color:#5c9eff;">${leg.bookmaker}</span><br>` : '';
    const lbl = leg.label    ? `<span style="font-size:.72rem;color:#aaa;">${leg.label}</span>` : '';

    tr.innerHTML = `
      <td class="leg-num">${i + 1}</td>
      <td>
        <div>${bm}${lbl}</div>
        <div class="odds-wrap" style="margin-top:4px;">
          <button class="odds-btn" onclick="changeOdds(${i},-0.01)">−</button>
          <input type="number" class="odds-input" value="${leg.odds.toFixed(2)}"
            step="0.01" min="1.01" oninput="onOddsChange(${i},this.value)">
          <button class="odds-btn" onclick="changeOdds(${i},0.01)">+</button>
        </div>
      </td>
      <td>
        <input type="number" class="stake-input" value="${leg.stake}"
          step="1" min="0" oninput="onStakeChange(${i},this.value)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d">
        <input type="checkbox" checked disabled title="Distribute actief">
      </td>
      <td class="col-f">
        <input type="radio" name="fixed" value="${i}"
          ${fixedTarget === i ? 'checked' : ''}
          onchange="setFixed(${i})">
      </td>
      <td class="col-profit ${profitClass(profit)}">${profitStr(profit)}</td>
      <td><button class="remove-btn" onclick="removeLeg(${i})" title="Verwijder leg">×</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Total row
  document.getElementById('totalF').checked = fixedTarget === 'total';
  const minProfit = getMinProfit();
  document.getElementById('totalProfit').textContent = profitStr(minProfit);
  document.getElementById('totalProfit').className = 'col-profit ' + profitClass(minProfit);
}

// ── Render mobile ─────────────────────────────────────────
function renderMobile() {
  const container = document.getElementById('mobileLegs');
  container.innerHTML = '';

  legs.forEach((leg, i) => {
    const profit = getProfitForLeg(i);
    const div = document.createElement('div');
    div.className = 'leg-card';

    const bm  = leg.bookmaker ? `<span style="color:#5c9eff;">${leg.bookmaker}</span> — ` : '';
    const lbl = leg.label || `Uitkomst ${i+1}`;

    div.innerHTML = `
      <div class="leg-card-header">
        <span class="leg-card-title">Leg ${i+1}: ${bm}${lbl}</span>
        ${legs.length > 2
          ? `<button class="remove-btn" onclick="removeLeg(${i})">×</button>`
          : ''}
      </div>

      <div class="leg-card-row">
        <span class="leg-card-label">Odds</span>
        <button class="odds-btn" onclick="changeOdds(${i},-0.01)">−</button>
        <input type="number" class="odds-input" value="${leg.odds.toFixed(2)}"
          step="0.01" min="1.01" style="flex:1;"
          oninput="onOddsChange(${i},this.value)">
        <button class="odds-btn" onclick="changeOdds(${i},0.01)">+</button>
      </div>

      <div class="leg-card-row">
        <span class="leg-card-label">Inzet (EUR)</span>
        <input type="number" class="stake-input" value="${leg.stake}"
          step="1" min="0" style="flex:1;"
          oninput="onStakeChange(${i},this.value)">
      </div>

      <div class="df-row">
        <label class="df-item">
          <input type="checkbox" checked disabled> D
        </label>
        <label class="df-item">
          <input type="radio" name="fixedMob" value="${i}"
            ${fixedTarget === i ? 'checked' : ''}
            onchange="setFixed(${i})"> F
        </label>
        <span class="leg-card-profit ${profitClass(profit)}" style="margin-left:auto;">
          Winst: ${profitStr(profit)} EUR
        </span>
      </div>
    `;
    container.appendChild(div);
  });

  // Total mob
  document.getElementById('totalFMob').checked = fixedTarget === 'total';
  const minProfit = getMinProfit();
  const el = document.getElementById('totalProfitMob');
  el.textContent = 'Min. winst: ' + profitStr(minProfit) + ' EUR';
  el.className = profitClass(minProfit);
}

// ── Summary ───────────────────────────────────────────────
function renderSummary() {
  const totalIn  = legs.reduce((s, l) => s + l.stake, 0);
  const minPayout = legs.length ? Math.min(...legs.map(l => l.stake * l.odds)) : 0;
  const minProfit = minPayout - totalIn;
  const profitPct = totalIn > 0 ? (minProfit / totalIn * 100) : 0;

  const el = document.getElementById('summary');
  el.innerHTML = `
    <div class="sum-item">
      <div class="sum-label">Totale inzet</div>
      <div class="sum-value sum-white">€${totalIn.toFixed(0)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white">€${minPayout.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winst</div>
      <div class="sum-value ${minProfit >= 0 ? 'sum-green' : 'sum-red'}">€${minProfit.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Marge</div>
      <div class="sum-value ${profitPct >= 0 ? 'sum-green' : 'sum-red'}">${profitPct.toFixed(2)}%</div>
    </div>
  `;
}

function renderAll() {
  renderDesktop();
  renderMobile();
  renderSummary();
}

// ── Event handlers ────────────────────────────────────────
function changeOdds(i, delta) {
  legs[i].odds = Math.max(1.01, Math.round((legs[i].odds + delta) * 100) / 100);
  recalc();
  renderAll();
}

function onOddsChange(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v > 1) { legs[i].odds = v; recalc(); renderAll(); }
}

function onStakeChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v)) return;
  legs[i].stake = Math.round(v);
  legs[i].fixed = true;
  fixedTarget = i;
  // Uncheck total fixed radios
  document.getElementById('totalF').checked    = false;
  document.getElementById('totalFMob').checked = false;
  // Recalc other legs
  const fi = i;
  const fixedPayout = legs[fi].stake * legs[fi].odds;
  const impliedOther = legs.reduce((s, l, idx) => idx === fi ? s : s + (l.odds > 1 ? 1/l.odds : 0), 0);
  legs.forEach((l, idx) => {
    if (idx === fi) return;
    const raw = l.odds > 1 ? fixedPayout / l.odds : 0;
    l.stake = Math.round(raw);
  });
  const newTotal = legs.reduce((s, l) => s + l.stake, 0);
  document.getElementById('totalStake').value    = newTotal;
  document.getElementById('totalStakeMob').value = newTotal;
  renderAll();
}

function setFixed(i) {
  fixedTarget = i;
  recalc();
  renderAll();
}

function syncTotal(src) {
  const val = src === 'mob'
    ? document.getElementById('totalStakeMob').value
    : document.getElementById('totalStake').value;
  document.getElementById('totalStake').value    = val;
  document.getElementById('totalStakeMob').value = val;
  if (fixedTarget === 'total') { recalc(); renderAll(); }
}

function syncFixedMob(val) {
  fixedTarget = val === 'total' ? 'total' : parseInt(val);
  document.getElementById('totalF').checked = val === 'total';
  recalc();
  renderAll();
}

// Total stake change
document.getElementById('totalStake').addEventListener('input', function() {
  document.getElementById('totalStakeMob').value = this.value;
  if (fixedTarget === 'total') { recalc(); renderAll(); }
});
document.getElementById('totalStakeMob').addEventListener('input', function() {
  document.getElementById('totalStake').value = this.value;
  if (fixedTarget === 'total') { recalc(); renderAll(); }
});
document.getElementById('totalF').addEventListener('change', function() {
  if (this.checked) { fixedTarget = 'total'; document.getElementById('totalFMob').checked = true; recalc(); renderAll(); }
});
document.getElementById('totalFMob').addEventListener('change', function() {
  if (this.checked) { fixedTarget = 'total'; document.getElementById('totalF').checked = true; recalc(); renderAll(); }
});

// ── Init ──────────────────────────────────────────────────
parseURL();
recalc();
renderAll();
</script>
</body>
</html>
