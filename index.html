<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    input[type="number"], input[type="text"] {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
      -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus, input[type="text"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    input[type="number"]:hover:not(:focus), input[type="text"]:hover:not(:focus) { border-color: #5c9eff; }
    input.error {
      border-color: #ff5555 !important;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15) !important;
    }
    .odds-inp  { width: 80px; }
    .stake-inp { width: 80px; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }

    /* ── CHECKBOX ── */
    .col-d input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #00c853;
    }

    /* ── CUSTOM RADIO ── */
    .fixed-radio {
      width: 16px; height: 16px; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      border: 2px solid #3a5a9a;
      border-radius: 50%;
      background: #0d2545;
      transition: all .15s;
      position: relative;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .fixed-radio:checked {
      border-color: #2196f3;
      background: #2196f3;
      box-shadow: 0 0 0 3px rgba(33,150,243,0.3);
    }
    .fixed-radio:checked::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .fixed-radio:hover:not(:checked) { border-color: #5c9eff; }

    .col-profit { width: 90px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .leg-label {
      font-size: 0.72rem; color: #7a9acc; max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .leg-bm {
      font-size: 0.68rem; color: #5c9eff; font-weight: 600;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e3a6a;
    }
    .leg-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .leg-card-subtitle {
      font-size: 0.72rem; color: #7a9acc; margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
    }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .leg-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .leg-card-row input[type="number"], .leg-card-row input[type="text"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .leg-card-row input:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    .leg-card-row input.error {
      border-color: #ff5555;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15);
    }

    .df-row {
      display: flex; gap: 16px; align-items: center;
      padding: 8px 10px;
      background: #0a1e3d;
      border-radius: 8px;
      border: 1px solid #1e3a6a;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input[type="radio"] {
      width: 16px; height: 16px; cursor: pointer;
      appearance: none; -webkit-appearance: none;
      border: 2px solid #3a5a9a;
      border-radius: 50%;
      background: #0a1e3d;
      transition: all .15s;
      position: relative;
      display: inline-block;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .df-item input[type="radio"]:checked {
      border-color: #2196f3;
      background: #2196f3;
      box-shadow: 0 0 0 3px rgba(33,150,243,0.3);
    }
    .df-item input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #fff;
    }
    .df-item input[type="checkbox"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #00c853;
    }

    .total-card {
      background: #0d2545;
      border: 1.5px solid #5c9eff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(92,158,255,0.1);
    }
    .total-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a6a;
    }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .total-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .total-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #5c9eff;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .total-card-row input:focus { border-color: #00c853; box-shadow: 0 0 0 2px rgba(0,200,83,0.15); }

    /* ── SUMMARY ── */
    .summary {
      background: #0d2545;
      border: 1px solid #2a2a5a;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex; flex-wrap: wrap; gap: 16px;
      margin-top: 4px;
    }
    .summary-item { display: flex; flex-direction: column; gap: 2px; }
    .summary-label { font-size: 0.68rem; color: #7a9acc; text-transform: uppercase; letter-spacing: .04em; }
    .summary-value { font-size: 0.9rem; font-weight: 700; }
    .sv-profit { color: #00c853; }
    .sv-neg    { color: #ff5555; }
    .sv-neutral{ color: #aaa; }

    @media (max-width: 600px) {
      .desktop-view { display: none; }
      .mobile-view  { display: block; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="match-title"></div>
  <div class="market" id="market-title"></div>

  <!-- DESKTOP -->
  <div class="desktop-view">
    <div class="table-wrap">
      <table class="calc-table">
        <thead>
          <tr>
            <th class="left" colspan="2">Leg</th>
            <th>Odds</th>
            <th>Inzet (€)</th>
            <th class="col-d">
              <div class="th-icon">D <span class="tip" title="Distribute: inzet wordt automatisch herberekend">?</span></div>
            </th>
            <th class="col-f">
              <div class="th-icon">F <span class="tip" title="Fixed: dit bedrag staat vast">?</span></div>
            </th>
            <th class="col-profit" style="text-align:right">Winst</th>
          </tr>
        </thead>
        <tbody id="desktop-body"></tbody>
        <tfoot id="desktop-foot"></tfoot>
      </table>
    </div>
  </div>

  <!-- MOBILE -->
  <div class="mobile-view" id="mobile-cards"></div>

  <!-- SUMMARY -->
  <div class="summary" id="summary">
    <div class="summary-item">
      <span class="summary-label">Rendement</span>
      <span class="summary-value sv-neutral" id="sum-pct">—</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Totale inzet</span>
      <span class="summary-value sv-neutral" id="sum-total">—</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Min. uitbetaling</span>
      <span class="summary-value sv-neutral" id="sum-min">—</span>
    </div>
    <div class="summary-item">
      <span class="summary-label">Winst</span>
      <span class="summary-value sv-neutral" id="sum-profit">—</span>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let numLegs    = 2;
let fixedIndex = -1;   // -1 = total fixed; 0+ = leg index fixed

// Per-leg state
let S = []; // { odds, stake, distribute, label, bookmaker }

// ─────────────────────────────────────────────────────────────────────────────
// URL PARAMS
// ─────────────────────────────────────────────────────────────────────────────
function parseURLParams() {
  const p      = new URLSearchParams(window.location.search);
  const match  = p.get('match')  || '';
  const market = p.get('market') || '';
  const odds   = (p.get('odds')   || '').split(',').map(Number).filter(Boolean);
  const labels = (p.get('labels') || '').split('|');
  const bms    = (p.get('bms')    || '').split('|');
  const stake  = parseFloat(p.get('stake')) || 100;

  if (match)  document.getElementById('match-title').textContent  = match;
  if (market) document.getElementById('market-title').textContent = market;

  numLegs = Math.max(2, odds.length);
  S = Array.from({ length: numLegs }, (_, i) => ({
    odds:       odds[i] || 2.0,
    stake:      0,
    distribute: true,
    label:      labels[i] || `Uitkomst ${i+1}`,
    bookmaker:  bms[i]    || '',
  }));

  // Set total stake and distribute from total
  const totalInp = document.getElementById('total-inp');
  if (totalInp) totalInp.value = stake;
  recalculate(stake);
}

// ─────────────────────────────────────────────────────────────────────────────
// EFFECTIVE ODDS (no commission in this version)
// ─────────────────────────────────────────────────────────────────────────────
function effOdds(i) { return S[i].odds; }

// ─────────────────────────────────────────────────────────────────────────────
// IMPLIED SUM & PROFIT PCT
// ─────────────────────────────────────────────────────────────────────────────
function impliedSum() {
  let sum = 0;
  for (let i = 0; i < numLegs; i++) {
    const e = effOdds(i);
    if (e <= 1) return NaN;
    sum += 1 / e;
  }
  return sum;
}

function profitPct() {
  const s = impliedSum();
  return (isNaN(s) || s <= 0) ? NaN : (1 / s - 1) * 100;
}

// ─────────────────────────────────────────────────────────────────────────────
// ROUNDING
// ─────────────────────────────────────────────────────────────────────────────
function doRound(val) { return Math.round(val); }

function fmt(val) {
  if (isNaN(val) || !isFinite(val)) return '0';
  return parseFloat(val.toFixed(2)).toString();
}

// ─────────────────────────────────────────────────────────────────────────────
// RECALCULATE
// ─────────────────────────────────────────────────────────────────────────────
function recalculate(overrideTotal) {
  const iSum = impliedSum();
  if (isNaN(iSum) || iSum <= 0) { updateDisplay(); return; }

  if (fixedIndex === -1) {
    // Total is fixed
    const totalEl = document.getElementById('total-inp');
    const total   = overrideTotal != null ? overrideTotal : (parseFloat(totalEl?.value) || 0);
    if (total <= 0) { updateDisplay(); return; }

    const returnAmt = total / iSum;
    for (let i = 0; i < numLegs; i++) {
      if (!S[i].distribute) continue;
      S[i].stake = doRound(returnAmt / effOdds(i));
    }

  } else {
    // Specific leg is fixed → equal-return for others
    const anchor    = S[fixedIndex];
    const anchorEff = effOdds(fixedIndex);
    if (anchorEff <= 1 || anchor.stake <= 0) { updateDisplay(); return; }

    const returnAmt = anchor.stake * anchorEff;
    for (let i = 0; i < numLegs; i++) {
      if (i === fixedIndex || !S[i].distribute) continue;
      const e = effOdds(i);
      if (e > 1) S[i].stake = doRound(returnAmt / e);
    }
    syncStakesToDOM();
    updateTotalFromLegs();
    updateDisplay();
    return;
  }

  syncStakesToDOM();
  updateTotalFromLegs();
  updateDisplay();
}

// ─────────────────────────────────────────────────────────────────────────────
// SYNC
// ─────────────────────────────────────────────────────────────────────────────
function syncStakesToDOM() {
  for (let i = 0; i < numLegs; i++) {
    // Desktop
    const dEl = document.getElementById(`d-stake-${i}`);
    if (dEl && document.activeElement !== dEl) dEl.value = fmt(S[i].stake);
    // Mobile
    const mEl = document.getElementById(`m-stake-${i}`);
    if (mEl && document.activeElement !== mEl) mEl.value = fmt(S[i].stake);
  }
}

function updateTotalFromLegs() {
  const total = S.reduce((s, leg) => s + (leg.stake || 0), 0);
  const tEl   = document.getElementById('total-inp');
  const mTEl  = document.getElementById('m-total-inp');
  if (tEl  && document.activeElement !== tEl)  tEl.value  = fmt(total);
  if (mTEl && document.activeElement !== mTEl) mTEl.value = fmt(total);
}

function syncAllFromDOM() {
  for (let i = 0; i < numLegs; i++) {
    const dOdds  = document.getElementById(`d-odds-${i}`);
    const dStake = document.getElementById(`d-stake-${i}`);
    const mOdds  = document.getElementById(`m-odds-${i}`);
    const mStake = document.getElementById(`m-stake-${i}`);

    const oddsEl  = document.activeElement === dOdds  ? dOdds  : (document.activeElement === mOdds  ? mOdds  : (dOdds  || mOdds));
    const stakeEl = document.activeElement === dStake ? dStake : (document.activeElement === mStake ? mStake : (dStake || mStake));

    if (oddsEl)  { const v = parseFloat(oddsEl.value);  if (v > 1) S[i].odds  = v; }
    if (stakeEl) { const v = parseFloat(stakeEl.value); if (!isNaN(v) && v >= 0) S[i].stake = v; }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// UPDATE DISPLAY (profit cells + summary)
// ─────────────────────────────────────────────────────────────────────────────
function updateDisplay() {
  const pct = profitPct();

  // Per-leg returns
  const returns    = S.map((s, i) => (s.stake || 0) * effOdds(i));
  const totalStake = S.reduce((sum, s) => sum + (s.stake || 0), 0);
  const minReturn  = Math.min(...returns);

  for (let i = 0; i < numLegs; i++) {
    const profit = returns[i] - totalStake;
    const txt    = S[i].stake > 0
      ? (profit >= 0 ? `+€${profit.toFixed(2)}` : `-€${Math.abs(profit).toFixed(2)}`)
      : '—';
    const cls = S[i].stake > 0 ? (profit >= 0 ? 'profit-pos' : 'profit-neg') : 'profit-zero';

    const dEl = document.getElementById(`d-profit-${i}`);
    const mEl = document.getElementById(`m-profit-${i}`);
    if (dEl) { dEl.textContent = txt; dEl.className = `col-profit ${cls}`; }
    if (mEl) { mEl.textContent = txt; mEl.className = `leg-card-profit ${cls}`; }
  }

  // Total profit cell
  const totalProfit = totalStake > 0 ? minReturn - totalStake : NaN;
  const tPEl  = document.getElementById('d-total-profit');
  const mtPEl = document.getElementById('m-total-profit');
  const tTxt  = totalStake > 0 ? (totalProfit >= 0 ? `+€${totalProfit.toFixed(2)}` : `-€${Math.abs(totalProfit).toFixed(2)}`) : '—';
  const tCls  = totalStake > 0 ? (totalProfit >= 0 ? 'profit-pos' : 'profit-neg') : 'profit-zero';
  if (tPEl)  { tPEl.textContent  = tTxt; tPEl.className  = `col-profit ${tCls}`; }
  if (mtPEl) { mtPEl.textContent = tTxt; mtPEl.className = `leg-card-profit ${tCls}`; }

  // Summary
  const pctEl    = document.getElementById('sum-pct');
  const totalEl  = document.getElementById('sum-total');
  const minEl    = document.getElementById('sum-min');
  const profitEl = document.getElementById('sum-profit');

  if (pctEl) {
    if (isNaN(pct)) { pctEl.textContent = '—'; pctEl.className = 'summary-value sv-neutral'; }
    else if (pct > 0) { pctEl.textContent = `+${pct.toFixed(2)}%`; pctEl.className = 'summary-value sv-profit'; }
    else { pctEl.textContent = `${pct.toFixed(2)}%`; pctEl.className = 'summary-value sv-neg'; }
  }
  if (totalEl)  totalEl.textContent  = totalStake > 0 ? `€${fmt(totalStake)}` : '—';
  if (minEl)    minEl.textContent    = totalStake > 0 ? `€${minReturn.toFixed(2)}` : '—';
  if (profitEl) {
    if (totalStake > 0) {
      profitEl.textContent = totalProfit >= 0 ? `+€${totalProfit.toFixed(2)}` : `-€${Math.abs(totalProfit).toFixed(2)}`;
      profitEl.className   = totalProfit >= 0 ? 'summary-value sv-profit' : 'summary-value sv-neg';
    } else {
      profitEl.textContent = '—';
      profitEl.className   = 'summary-value sv-neutral';
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// FIXED CHANGE
// ─────────────────────────────────────────────────────────────────────────────
function onFixedChange(val) {
  const prev     = fixedIndex;
  fixedIndex     = val;

  // Sync all radios
  document.querySelectorAll('.fixed-radio').forEach(r => {
    r.checked = (parseInt(r.dataset.idx) === val);
  });

  if (val >= 0 && val < numLegs) {
    // Read current stake of newly fixed leg as anchor
    const dEl = document.getElementById(`d-stake-${val}`);
    const mEl = document.getElementById(`m-stake-${val}`);
    const v   = parseFloat((dEl || mEl)?.value);
    if (!isNaN(v) && v >= 0) S[val].stake = v;

    // Recalculate other legs for equal return
    const anchorEff = effOdds(val);
    if (anchorEff > 1 && S[val].stake > 0) {
      const returnAmt = S[val].stake * anchorEff;
      for (let i = 0; i < numLegs; i++) {
        if (i === val || !S[i].distribute) continue;
        const e = effOdds(i);
        if (e > 1) S[i].stake = doRound(returnAmt / e);
      }
    }
    syncStakesToDOM();
    updateTotalFromLegs();
    updateDisplay();
  } else {
    // Total became fixed
    recalculate();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// INPUT HANDLERS
// ─────────────────────────────────────────────────────────────────────────────
function onOddsChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v <= 1) return;
  S[i].odds = v;
  // Sync the other odds input (desktop↔mobile)
  const dEl = document.getElementById(`d-odds-${i}`);
  const mEl = document.getElementById(`m-odds-${i}`);
  if (dEl && document.activeElement !== dEl) dEl.value = val;
  if (mEl && document.activeElement !== mEl) mEl.value = val;
  recalculate();
}

function onStakeChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0) return;
  S[i].stake = v;

  // Sync the other stake input (desktop↔mobile)
  const dEl = document.getElementById(`d-stake-${i}`);
  const mEl = document.getElementById(`m-stake-${i}`);
  if (dEl && document.activeElement !== dEl) dEl.value = fmt(v);
  if (mEl && document.activeElement !== mEl) mEl.value = fmt(v);

  if (fixedIndex === i) {
    // This leg is fixed → recalculate others
    recalculate();
  } else {
    // Just update total and display
    updateTotalFromLegs();
    updateDisplay();
  }
}

function onTotalChange(val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0) return;

  // Sync both total inputs
  const dEl = document.getElementById('total-inp');
  const mEl = document.getElementById('m-total-inp');
  if (dEl && document.activeElement !== dEl) dEl.value = fmt(v);
  if (mEl && document.activeElement !== mEl) mEl.value = fmt(v);

  // Move fixed point to total and recalculate
  fixedIndex = -1;
  document.querySelectorAll('.fixed-radio').forEach(r => {
    r.checked = (parseInt(r.dataset.idx) === -1);
  });
  recalculate();
}

function onDistributeChange(i, checked) {
  S[i].distribute = checked;
  recalculate();
}

// ─────────────────────────────────────────────────────────────────────────────
// RENDER
// ─────────────────────────────────────────────────────────────────────────────
function render() {
  renderDesktop();
  renderMobile();
}

function renderDesktop() {
  const tbody = document.getElementById('desktop-body');
  const tfoot = document.getElementById('desktop-foot');
  tbody.innerHTML = '';

  for (let i = 0; i < numLegs; i++) {
    const s  = S[i];
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="leg-num">${i+1}</td>
      <td>
        <div class="leg-label" title="${s.label}">${s.label}</div>
        <div class="leg-bm">${s.bookmaker}</div>
      </td>
      <td>
        <input type="number" class="odds-inp" id="d-odds-${i}" value="${s.odds.toFixed(2)}" step="0.01" min="1.01"
          oninput="onOddsChange(${i}, this.value)">
      </td>
      <td>
        <input type="number" class="stake-inp" id="d-stake-${i}" value="${fmt(s.stake)}" step="1" min="0"
          oninput="onStakeChange(${i}, this.value)">
        <span class="currency">€</span>
      </td>
      <td class="col-d">
        <input type="checkbox" ${s.distribute ? 'checked' : ''} onchange="onDistributeChange(${i}, this.checked)">
      </td>
      <td class="col-f">
        <input type="radio" class="fixed-radio" name="fixed-grp" data-idx="${i}" ${fixedIndex === i ? 'checked' : ''}
          onchange="onFixedChange(${i})">
      </td>
      <td class="col-profit profit-zero" id="d-profit-${i}">—</td>
    `;
    tbody.appendChild(tr);
  }

  // Total row
  tfoot.innerHTML = `
    <tr class="sep">
      <td colspan="2" class="total-label">Totaal</td>
      <td></td>
      <td>
        <input type="number" class="stake-inp" id="total-inp" value="100" step="1" min="0"
          oninput="onTotalChange(this.value)">
        <span class="currency">€</span>
      </td>
      <td class="col-d">
        <input type="checkbox" checked disabled style="opacity:0.4">
      </td>
      <td class="col-f">
        <input type="radio" class="fixed-radio" name="fixed-grp" data-idx="-1" ${fixedIndex === -1 ? 'checked' : ''}
          onchange="onFixedChange(-1)">
      </td>
      <td class="col-profit profit-zero" id="d-total-profit">—</td>
    </tr>
  `;
}

function renderMobile() {
  const container = document.getElementById('mobile-cards');
  container.innerHTML = '';

  for (let i = 0; i < numLegs; i++) {
    const s   = S[i];
    const div = document.createElement('div');
    div.className = 'leg-card';
    div.innerHTML = `
      <div class="leg-card-header">
        <div>
          <div class="leg-card-title">Leg ${i+1} — ${s.bookmaker || `Leg ${i+1}`}</div>
          <div class="leg-card-subtitle">${s.label}</div>
        </div>
        <div class="leg-card-profit profit-zero" id="m-profit-${i}">—</div>
      </div>
      <div class="leg-card-row">
        <span class="leg-card-label">Odds</span>
        <input type="number" id="m-odds-${i}" value="${s.odds.toFixed(2)}" step="0.01" min="1.01"
          oninput="onOddsChange(${i}, this.value)">
      </div>
      <div class="leg-card-row">
        <span class="leg-card-label">Inzet €</span>
        <input type="number" id="m-stake-${i}" value="${fmt(s.stake)}" step="1" min="0"
          oninput="onStakeChange(${i}, this.value)">
      </div>
      <div class="df-row">
        <div class="df-item">
          <input type="checkbox" ${s.distribute ? 'checked' : ''} onchange="onDistributeChange(${i}, this.checked)">
          <span>Distribute</span>
        </div>
        <div class="df-item">
          <input type="radio" class="fixed-radio" name="fixed-grp" data-idx="${i}" ${fixedIndex === i ? 'checked' : ''}
            onchange="onFixedChange(${i})">
          <span>Fixed</span>
        </div>
      </div>
    `;
    container.appendChild(div);
  }

  // Total card
  const totalDiv = document.createElement('div');
  totalDiv.className = 'total-card';
  totalDiv.innerHTML = `
    <div class="total-card-title">Totale inzet</div>
    <div class="total-card-row">
      <span class="total-card-label">Inzet €</span>
      <input type="number" id="m-total-inp" value="100" step="1" min="0"
        oninput="onTotalChange(this.value)">
    </div>
    <div class="df-row">
      <div class="df-item">
        <input type="radio" class="fixed-radio" name="fixed-grp" data-idx="-1" ${fixedIndex === -1 ? 'checked' : ''}
          onchange="onFixedChange(-1)">
        <span>Fixed</span>
      </div>
      <div class="df-item" style="margin-left:auto">
        <span class="leg-card-profit profit-zero" id="m-total-profit">—</span>
      </div>
    </div>
  `;
  container.appendChild(totalDiv);
}

// ─────────────────────────────────────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────────────────────────────────────
function init() {
  const p      = new URLSearchParams(window.location.search);
  const match  = p.get('match')  || '';
  const market = p.get('market') || '';
  const odds   = (p.get('odds')   || '').split(',').map(Number).filter(n => n > 1);
  const labels = (p.get('labels') || '').split('|');
  const bms    = (p.get('bms')    || '').split('|');
  const stake  = parseFloat(p.get('stake')) || 100;

  if (match)  document.getElementById('match-title').textContent  = match;
  if (market) document.getElementById('market-title').textContent = market;

  numLegs    = Math.max(2, odds.length);
  fixedIndex = -1;

  S = Array.from({ length: numLegs }, (_, i) => ({
    odds:       odds[i]   || 2.0,
    stake:      0,
    distribute: true,
    label:      labels[i] || `Uitkomst ${i+1}`,
    bookmaker:  bms[i]    || '',
  }));

  render();

  // Set total and distribute
  const totalEl = document.getElementById('total-inp');
  const mTotalEl = document.getElementById('m-total-inp');
  if (totalEl)  totalEl.value  = stake;
  if (mTotalEl) mTotalEl.value = stake;

  recalculate(stake);
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
