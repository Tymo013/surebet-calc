<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    input[type="number"] {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
      -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    input[type="number"]:hover:not(:focus) { border-color: #5c9eff; }
    input[type="number"].error {
      border-color: #ff5555;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15);
    }
    .odds-input  { width: 80px; }
    .stake-input { width: 80px; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #00c853; }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 80px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .leg-label {
      font-size: 0.72rem; color: #7a9acc; max-width: 120px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .leg-bm {
      font-size: 0.68rem; color: #5c9eff; font-weight: 600;
      max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e3a6a;
    }
    .leg-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .leg-card-subtitle {
      font-size: 0.72rem; color: #7a9acc; margin-top: 2px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;
    }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .leg-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .leg-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .leg-card-row input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    .leg-card-row input[type="number"].error {
      border-color: #ff5555;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15);
    }

    .df-row {
      display: flex; gap: 16px; align-items: center;
      padding: 8px 10px;
      background: #0a1e3d;
      border-radius: 8px;
      border: 1px solid #1e3a6a;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input { width: 16px; height: 16px; accent-color: #00c853; cursor: pointer; }
    .df-item input[type="radio"] { accent-color: #2196f3; }

    .total-card {
      background: #0d2545;
      border: 1.5px solid #5c9eff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(92,158,255,0.1);
    }
    .total-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a6a;
    }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .total-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .total-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .total-card-row input[type="number"]:focus {
      border-color: #5c9eff;
      box-shadow: 0 0 0 2px rgba(92,158,255,0.15);
    }

    .add-leg {
      margin-top: 12px; background: none; border: 1.5px dashed #3a5a9a;
      color: #7a9acc; width: 100%; padding: 10px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; background: rgba(0,200,83,0.05); }

    .summary {
      margin-top: 16px;
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 16px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label {
      font-size: 0.68rem; color: #7a9acc; margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    .error-banner {
      background: rgba(255,85,85,0.12);
      border: 1.5px solid #ff5555;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      color: #ff8080;
      font-size: 0.82rem;
      display: none;
    }
    .error-banner.visible { display: block; }

    /* ── BREAKPOINT ── */
    @media (max-width: 600px) {
      body { padding: 10px 8px; }
      .card { padding: 14px 12px; border-radius: 12px; }
      .desktop-view { display: none; }
      .mobile-view  { display: block; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="matchName"></div>
  <div class="market" id="marketName"></div>

  <div class="error-banner" id="errorBanner"></div>

  <!-- DESKTOP -->
  <div class="desktop-view">
    <div class="table-wrap">
      <table class="calc-table" id="desktopTable">
        <thead>
          <tr>
            <th class="left" colspan="2">Odds</th>
            <th class="left" colspan="2">Inzet</th>
            <th class="col-d"><div class="th-icon">D <span class="tip" title="Distribute: wordt herberekend">?</span></div></th>
            <th class="col-f"><div class="th-icon">F <span class="tip" title="Fixed: houdt dit bedrag vast bij herberekening">?</span></div></th>
            <th class="col-profit">Winst</th>
          </tr>
        </thead>
        <tbody id="desktopBody"></tbody>
      </table>
    </div>
  </div>

  <!-- MOBILE -->
  <div class="mobile-view" id="mobileView"></div>

  <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>

  <div class="summary" id="summary">
    <div class="sum-item">
      <div class="sum-label">Rendement</div>
      <div class="sum-value sum-green" id="sumPct">0.00%</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Totaal inzet</div>
      <div class="sum-value sum-white" id="sumTotal">€0</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white" id="sumPayout">€0</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Garantiewinst</div>
      <div class="sum-value sum-green" id="sumProfit">€0</div>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────
let legs = [];
let fixedLeg = 'total'; // 'total' or leg index (number)

// ── URL PARAMS ────────────────────────────────────────────
(function initFromURL() {
  const p = new URLSearchParams(location.search);

  const matchEl  = document.getElementById('matchName');
  const marketEl = document.getElementById('marketName');
  if (p.get('match'))  matchEl.textContent  = p.get('match');
  if (p.get('market')) marketEl.textContent = p.get('market');

  const oddsArr   = (p.get('odds')   || '2,2').split(',').map(Number);
  const labelsArr = (p.get('labels') || '').split('|');
  const bmsArr    = (p.get('bms')    || '').split('|');
  const stake     = parseFloat(p.get('stake')) || 100;

  const imp = oddsArr.reduce((s, o) => s + (o > 1 ? 1/o : 0), 0);

  oddsArr.forEach((odds, i) => {
    if (odds <= 1) odds = 2;
    const s = imp > 0 ? Math.round(stake * (1/odds) / imp) : Math.round(stake / oddsArr.length);
    legs.push({
      odds,
      stake: s,
      label: labelsArr[i] || `Uitkomst ${i+1}`,
      bookmaker: bmsArr[i] || '',
    });
  });

  if (legs.length === 0) {
    legs.push({ odds: 2, stake: 50, label: 'Uitkomst 1', bookmaker: '' });
    legs.push({ odds: 2, stake: 50, label: 'Uitkomst 2', bookmaker: '' });
  }
})();

// ── BEREKENINGEN ──────────────────────────────────────────
function impliedSum() {
  return legs.reduce((s, l) => s + (l.odds > 1 ? 1/l.odds : 0), 0);
}

function profitPct() {
  const imp = impliedSum();
  if (imp >= 1 || imp <= 0) return 0;
  return (1/imp - 1) * 100;
}

function legProfit(i) {
  // Winst als leg i wint: payout - totalStake
  const payout = legs[i].stake * legs[i].odds;
  const total  = legs.reduce((s, l) => s + l.stake, 0);
  return payout - total;
}

function minPayout() {
  return Math.min(...legs.map(l => l.stake * l.odds));
}

function totalStake() {
  return legs.reduce((s, l) => s + l.stake, 0);
}

// Herbereken stakes o.b.v. fixed leg (wordt aangeroepen bij odds-wijziging)
function recalcFromFixed() {
  const imp = impliedSum();
  if (imp <= 0) return;

  if (fixedLeg === 'total') {
    const total = totalStake();
    legs.forEach(l => {
      l.stake = Math.round(total * (1/l.odds) / imp);
    });
  } else if (typeof fixedLeg === 'number' && legs[fixedLeg]) {
    const ref = legs[fixedLeg];
    legs.forEach((l, i) => {
      if (i === fixedLeg) return;
      // stake_i / stake_ref = (1/odds_i) / (1/odds_ref)
      l.stake = Math.round(ref.stake * (1/l.odds) / (1/ref.odds));
    });
  }
}

// ── VALIDATIE ─────────────────────────────────────────────
function validate() {
  const banner = document.getElementById('errorBanner');
  const errors = [];
  legs.forEach((l, i) => {
    if (l.odds <= 1) errors.push(`Leg ${i+1}: odds moet groter zijn dan 1.00`);
  });
  const imp = impliedSum();
  if (imp >= 1) errors.push(`Geen surebet: implied kans = ${(imp*100).toFixed(2)}% (moet < 100% zijn)`);

  if (errors.length) {
    banner.textContent = errors.join(' | ');
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
  return errors.length === 0;
}

// ── RENDER ────────────────────────────────────────────────
function render() {
  renderDesktop();
  renderMobile();
  renderSummary();
}

function renderDesktop() {
  const tbody = document.getElementById('desktopBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const p     = legProfit(i);
    const pCls  = p > 0.01 ? 'profit-pos' : p < -0.01 ? 'profit-neg' : 'profit-zero';
    const pTxt  = (p >= 0 ? '+' : '') + '€' + p.toFixed(2);

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="leg-num">${i+1}</td>
      <td>
        <div class="leg-label">${escHtml(leg.label)}</div>
        <div class="leg-bm">${escHtml(leg.bookmaker)}</div>
        <input type="number" class="odds-input" id="odds_${i}" value="${leg.odds}"
          step="0.01" min="1.01"
          oninput="onOddsInput(${i}, this)"
          onblur="onOddsBlur(${i}, this)">
      </td>
      <td>
        <input type="number" class="stake-input" id="stake_${i}" value="${leg.stake}"
          step="1" min="0"
          oninput="onStakeInput(${i}, this)"
          onblur="onStakeBlur(${i}, this)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d"><input type="checkbox" checked disabled title="Distribute"></td>
      <td class="col-f">
        <input type="radio" name="fixedLeg" value="${i}"
          ${fixedLeg === i ? 'checked' : ''}
          onchange="setFixed(${i})">
      </td>
      <td class="col-profit ${pCls}" id="profit_${i}">${pTxt}</td>
    `;
    tbody.appendChild(tr);
  });

  // Totaal rij
  const totalStr = totalStake();
  const sepTr = document.createElement('tr');
  sepTr.className = 'sep';
  sepTr.innerHTML = `
    <td colspan="2" class="total-label">Totaal inzet:</td>
    <td>
      <input type="number" class="stake-input" id="stake_total" value="${totalStr}"
        step="1" min="0"
        oninput="onTotalInput(this)"
        onblur="onTotalBlur(this)">
    </td>
    <td class="currency">EUR</td>
    <td class="col-d"><input type="checkbox" checked disabled></td>
    <td class="col-f">
      <input type="radio" name="fixedLeg" value="total"
        ${fixedLeg === 'total' ? 'checked' : ''}
        onchange="setFixed('total')">
    </td>
    <td></td>
  `;
  tbody.appendChild(sepTr);
}

function renderMobile() {
  const container = document.getElementById('mobileView');
  container.innerHTML = '';

  legs.forEach((leg, i) => {
    const p    = legProfit(i);
    const pCls = p > 0.01 ? 'profit-pos' : p < -0.01 ? 'profit-neg' : 'profit-zero';
    const pTxt = (p >= 0 ? '+' : '') + '€' + p.toFixed(2);

    const card = document.createElement('div');
    card.className = 'leg-card';
    card.innerHTML = `
      <div class="leg-card-header">
        <div>
          <div class="leg-card-title">Leg ${i+1} ${leg.bookmaker ? '· ' + escHtml(leg.bookmaker) : ''}</div>
          <div class="leg-card-subtitle">${escHtml(leg.label)}</div>
        </div>
        <div class="leg-card-profit ${pCls}" id="mprofit_${i}">${pTxt}</div>
      </div>
      <div class="leg-card-row">
        <div class="leg-card-label">Odds</div>
        <input type="number" id="modds_${i}" value="${leg.odds}" step="0.01" min="1.01"
          oninput="onOddsInput(${i}, this, true)"
          onblur="onOddsBlur(${i}, this, true)">
      </div>
      <div class="leg-card-row">
        <div class="leg-card-label">Inzet</div>
        <input type="number" id="mstake_${i}" value="${leg.stake}" step="1" min="0"
          oninput="onStakeInput(${i}, this, true)"
          onblur="onStakeBlur(${i}, this, true)">
        <span class="currency">EUR</span>
      </div>
      <div class="df-row">
        <div class="df-item"><input type="checkbox" checked disabled> D</div>
        <div class="df-item">
          <input type="radio" name="mfixedLeg" value="${i}"
            ${fixedLeg === i ? 'checked' : ''}
            onchange="setFixed(${i})"> F
        </div>
      </div>
    `;
    container.appendChild(card);
  });

  // Totaal kaart
  const totalCard = document.createElement('div');
  totalCard.className = 'total-card';
  totalCard.innerHTML = `
    <div class="total-card-title">Totaal inzet</div>
    <div class="total-card-row">
      <div class="total-card-label">Inzet</div>
      <input type="number" id="mstake_total" value="${totalStake()}" step="1" min="0"
        oninput="onTotalInput(this, true)"
        onblur="onTotalBlur(this, true)">
      <span class="currency">EUR</span>
    </div>
    <div class="df-row">
      <div class="df-item"><input type="checkbox" checked disabled> D</div>
      <div class="df-item">
        <input type="radio" name="mfixedLeg" value="total"
          ${fixedLeg === 'total' ? 'checked' : ''}
          onchange="setFixed('total')"> F
      </div>
    </div>
  `;
  container.appendChild(totalCard);
}

function renderSummary() {
  const imp  = impliedSum();
  const pct  = profitPct();
  const tot  = totalStake();
  const pay  = minPayout();
  const prof = pay - tot;

  document.getElementById('sumPct').textContent    = pct.toFixed(2) + '%';
  document.getElementById('sumTotal').textContent  = '€' + tot.toFixed(0);
  document.getElementById('sumPayout').textContent = '€' + pay.toFixed(2);
  document.getElementById('sumProfit').textContent = (prof >= 0 ? '+' : '') + '€' + prof.toFixed(2);

  document.getElementById('sumPct').className    = 'sum-value ' + (pct > 0 ? 'sum-green' : 'sum-red');
  document.getElementById('sumProfit').className = 'sum-value ' + (prof > 0 ? 'sum-green' : 'sum-red');
}

// Update alleen profit cellen + summary — ZONDER input velden aan te raken
function updateDerived() {
  legs.forEach((leg, i) => {
    const p    = legProfit(i);
    const pCls = p > 0.01 ? 'profit-pos' : p < -0.01 ? 'profit-neg' : 'profit-zero';
    const pTxt = (p >= 0 ? '+' : '') + '€' + p.toFixed(2);

    const profEl  = document.getElementById(`profit_${i}`);
    const mprofEl = document.getElementById(`mprofit_${i}`);
    if (profEl)  { profEl.textContent  = pTxt; profEl.className  = `col-profit ${pCls}`; }
    if (mprofEl) { mprofEl.textContent = pTxt; mprofEl.className = `leg-card-profit ${pCls}`; }
  });
  renderSummary();
  validate();
}

// Update ALLE stake velden behalve de opgegeven skip-id
function updateStakeFields(skipId) {
  legs.forEach((l, i) => {
    const ids = [`stake_${i}`, `mstake_${i}`];
    ids.forEach(id => {
      if (id === skipId) return;
      const el = document.getElementById(id);
      if (el) el.value = l.stake;
    });
  });
  // Update totaal veld als dat niet het skip-id is
  ['stake_total', 'mstake_total'].forEach(id => {
    if (id === skipId) return;
    const el = document.getElementById(id);
    if (el) el.value = totalStake();
  });
}

// ── EVENT HANDLERS ────────────────────────────────────────

// ODDS: live input → herbereken stakes, update alles behalve dit veld
function onOddsInput(i, el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val <= 1) {
    el.classList.add('error');
    return;
  }
  el.classList.remove('error');
  legs[i].odds = val;

  // Sync het andere odds veld (desktop ↔ mobile)
  const otherId = isMobile ? `odds_${i}` : `modds_${i}`;
  const other = document.getElementById(otherId);
  if (other) other.value = val;

  recalcFromFixed();
  updateStakeFields(el.id);
  updateDerived();
}

// ODDS: blur → valideer, reset bij fout
function onOddsBlur(i, el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val <= 1) {
    legs[i].odds = 2;
    el.value = 2;
    el.classList.remove('error');
    const otherId = isMobile ? `odds_${i}` : `modds_${i}`;
    const other = document.getElementById(otherId);
    if (other) other.value = 2;
    recalcFromFixed();
    updateStakeFields(null);
    updateDerived();
  }
}

// STAKE: live input → update state + derived, NIET andere stakes aanpassen
function onStakeInput(i, el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val < 0) return;
  legs[i].stake = val;

  // Sync het andere stake veld
  const otherId = isMobile ? `stake_${i}` : `mstake_${i}`;
  const other = document.getElementById(otherId);
  if (other && other !== el) other.value = val;

  // Update totaal veld
  ['stake_total', 'mstake_total'].forEach(id => {
    const el2 = document.getElementById(id);
    if (el2) el2.value = totalStake();
  });

  updateDerived();
}

// STAKE: blur → afronden naar hele euro, geen herberekening
function onStakeBlur(i, el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val < 0) {
    el.value = legs[i].stake;
    return;
  }
  const rounded = Math.round(val);
  legs[i].stake = rounded;
  el.value = rounded;

  // Sync ander veld
  const otherId = isMobile ? `stake_${i}` : `mstake_${i}`;
  const other = document.getElementById(otherId);
  if (other) other.value = rounded;

  // Update totaal
  ['stake_total', 'mstake_total'].forEach(id => {
    const el2 = document.getElementById(id);
    if (el2) el2.value = totalStake();
  });

  updateDerived();
}

// TOTAAL INPUT: herbereken alle legs proportioneel
function onTotalInput(el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val <= 0) return;

  const imp = impliedSum();
  if (imp <= 0) return;

  legs.forEach(l => {
    l.stake = Math.round(val * (1/l.odds) / imp);
  });

  // Sync ander totaal veld
  const otherId = isMobile ? 'stake_total' : 'mstake_total';
  const other = document.getElementById(otherId);
  if (other) other.value = val;

  updateStakeFields(el.id);
  updateDerived();
}

// TOTAAL BLUR: afronden
function onTotalBlur(el, isMobile) {
  const val = parseFloat(el.value);
  if (isNaN(val) || val <= 0) {
    el.value = totalStake();
    return;
  }
  const rounded = Math.round(val);

  const imp = impliedSum();
  if (imp <= 0) return;

  legs.forEach(l => {
    l.stake = Math.round(rounded * (1/l.odds) / imp);
  });

  el.value = rounded;

  const otherId = isMobile ? 'stake_total' : 'mstake_total';
  const other = document.getElementById(otherId);
  if (other) other.value = rounded;

  updateStakeFields(el.id);
  updateDerived();
}

// FIXED: alleen radio-klik mag fixedLeg veranderen
function setFixed(val) {
  const prevFixed = fixedLeg;
  fixedLeg = val === 'total' ? 'total' : parseInt(val);

  // Sync beide radio groepen
  document.querySelectorAll('input[name="fixedLeg"]').forEach(r => {
    r.checked = (r.value == val);
  });
  document.querySelectorAll('input[name="mfixedLeg"]').forEach(r => {
    r.checked = (r.value == val);
  });

  // ← NIEUW: sync huidige input waarden naar legs array VOOR herberekening
  legs.forEach((leg, i) => {
    const oddsEl  = document.getElementById(`odds_${i}`)  || document.getElementById(`modds_${i}`);
    const stakeEl = document.getElementById(`stake_${i}`) || document.getElementById(`mstake_${i}`);
    if (oddsEl)  leg.odds  = parseFloat(oddsEl.value)  || leg.odds;
    if (stakeEl) leg.stake = parseFloat(stakeEl.value) || leg.stake;
  });

  // Als fixed leg verandert naar een specifieke leg → herbereken andere legs
  if (prevFixed !== fixedLeg && fixedLeg !== 'total') {
    const fixedStake = legs[fixedLeg].stake;
    const fixedOdds  = legs[fixedLeg].odds;

    if (fixedStake > 0 && fixedOdds > 1) {
      const payout = fixedStake * fixedOdds;

      for (let i = 0; i < legs.length; i++) {
        if (i === fixedLeg) continue;
        const o = legs[i].odds;
        if (o > 1) {
          legs[i].stake = Math.round(payout / o);
        }
      }
    }
  }

  calculate();
}

function addLeg() {
  legs.push({ odds: 2, stake: Math.round(totalStake() / (legs.length + 1)), label: `Uitkomst ${legs.length+1}`, bookmaker: '' });
  recalcFromFixed();
  render();
}

function escHtml(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ──────────────────────────────────────────────────
render();
validate();
</script>
