<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    .odds-wrap { display: flex; align-items: center; gap: 3px; }
    .odds-btn {
      background: #0f3460; border: 1px solid #2a4a7a; color: #aaa;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .odds-btn:hover { border-color: #00c853; color: #00c853; }

    input[type="number"] {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
      -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    input[type="number"]:hover:not(:focus) {
      border-color: #5c9eff;
    }
    .odds-input  { width: 72px; }
    .stake-input { width: 80px; text-align: right; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #00c853; }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 72px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .remove-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 1rem; padding: 0 3px; opacity: .6; }
    .remove-btn:hover { opacity: 1; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e3a6a;
    }
    .leg-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .leg-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .leg-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .leg-card-row input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    .leg-card-row .odds-wrap { flex: 1; }
    .leg-card-row .odds-wrap input[type="number"] {
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
    }

    .df-row {
      display: flex; gap: 16px; align-items: center;
      padding: 8px 10px;
      background: #0a1e3d;
      border-radius: 8px;
      border: 1px solid #1e3a6a;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input { width: 16px; height: 16px; accent-color: #00c853; cursor: pointer; }
    .df-item input[type="radio"] { accent-color: #2196f3; }

    /* Total card op mobiel */
    .total-card {
      background: #0d2545;
      border: 1.5px solid #5c9eff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(92,158,255,0.1);
    }
    .total-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a6a;
    }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .total-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .total-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .total-card-row input[type="number"]:focus {
      border-color: #5c9eff;
      box-shadow: 0 0 0 2px rgba(92,158,255,0.15);
    }

    /* Add leg */
    .add-leg {
      margin-top: 12px; background: none; border: 1.5px dashed #3a5a9a;
      color: #7a9acc; width: 100%; padding: 10px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; background: rgba(0,200,83,0.05); }

    /* Summary */
    .summary {
      margin-top: 16px;
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 16px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label {
      font-size: 0.68rem; color: #7a9acc; margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    /* ── BREAKPOINT ── */
    @media (max-width: 600px) {
      body { padding: 10px 8px; }
      .card { padding: 14px 12px; border-radius: 12px; }
      .desktop-view { display: none !important; }
      .mobile-view  { display: block !important; }
      h1 { font-size: 1rem; }
      .match  { font-size: 0.78rem; }
      .market { font-size: 0.72rem; }
      .summary { gap: 8px; padding: 12px; }
      .sum-value { font-size: 0.92rem; }
      .sum-item { min-width: 60px; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match"  id="matchLabel"></div>
  <div class="market" id="marketLabel"></div>

  <!-- ══ DESKTOP VIEW ══ -->
  <div class="desktop-view">
    <div class="table-wrap">
    <table class="calc-table">
      <thead>
        <tr>
          <th style="width:20px"></th>
          <th class="left" style="min-width:80px">Odds</th>
          <th style="min-width:90px">Inzet</th>
          <th style="width:18px"></th>
          <th class="col-d"><div class="th-icon">D <span class="tip" title="Distribute: herbereken automatisch bij wijziging">?</span></div></th>
          <th class="col-f"><div class="th-icon">F <span class="tip" title="Fixed: houd deze inzet vast bij herberekening">?</span></div></th>
          <th class="col-profit">Winst</th>
          <th style="width:22px"></th>
        </tr>
      </thead>
      <tbody id="legsBody"></tbody>
      <tbody>
        <tr class="sep">
          <td colspan="2" class="total-label">Totale inzet:</td>
          <td><input type="number" class="stake-input" id="totalStake" value="100" min="0" step="1"></td>
          <td class="currency">EUR</td>
          <td class="col-d"><input type="checkbox" id="totalD" checked title="Herverdeel totaal over legs"></td>
          <td class="col-f"><input type="radio" name="fixed" value="total" id="totalF"></td>
          <td class="col-profit" id="totalProfit">—</td>
          <td></td>
        </tr>
      </tbody>
    </table>
    </div>
    <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>
  </div>

  <!-- ══ MOBILE VIEW ══ -->
  <div class="mobile-view">
    <div id="mobileLegs"></div>

    <!-- Totaal kaart -->
    <div class="total-card">
      <div class="total-card-title">💶 Totale inzet</div>
      <div class="total-card-row">
        <span class="total-card-label">Bedrag</span>
        <input type="number" id="totalStakeMob" value="100" min="0" step="1">
        <span class="currency">EUR</span>
      </div>
      <div class="df-row">
        <label class="df-item">
          <input type="checkbox" id="totalDMob" checked> D
        </label>
        <label class="df-item">
          <input type="radio" name="fixedMob" value="total" id="totalFMob"> F
        </label>
        <span style="margin-left:auto; font-size:0.85rem; font-weight:700;" id="totalProfitMob">—</span>
      </div>
    </div>

    <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>
  </div>

  <!-- ══ SUMMARY ══ -->
  <div class="summary">
    <div class="sum-item">
      <div class="sum-label">Totale inzet</div>
      <div class="sum-value sum-white" id="sumTotal">€0</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white" id="sumPayout">€0</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winst</div>
      <div class="sum-value" id="sumProfit">€0</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Rendement</div>
      <div class="sum-value" id="sumPct">0%</div>
    </div>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let legs = [];
let fixedLeg = 'total'; // 'total' or index

// ── URL params ─────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const oddsParam   = (params.get('odds')   || '2,2').split(',').map(Number);
const labelsParam = (params.get('labels') || '').split('|');
const bmsParam    = (params.get('bms')    || '').split('|');
const stakeParam  = parseFloat(params.get('stake') || '100');
const matchParam  = params.get('match') || '';
const marketParam = params.get('market') || '';

document.getElementById('matchLabel').textContent  = matchParam;
document.getElementById('marketLabel').textContent = marketParam;

// Init legs from URL or defaults
const initOdds = oddsParam.length >= 2 ? oddsParam : [2, 2];
initOdds.forEach((o, i) => {
  legs.push({
    odds:  o || 2,
    label: labelsParam[i] || `Leg ${i+1}`,
    bm:    bmsParam[i]    || '',
    d:     true,
    stake: 0,
  });
});

// ── Rounding ───────────────────────────────────────────────
function roundStake(v) {
  return Math.round(v);
}

// ── Calc ───────────────────────────────────────────────────
function calcImplied() {
  return legs.reduce((s, l) => s + 1 / l.odds, 0);
}

function recalc() {
  const totalStake = parseFloat(document.getElementById('totalStake')?.value || stakeParam) || 100;
  const implied = calcImplied();

  if (fixedLeg === 'total') {
    // Distribute based on total stake
    legs.forEach(l => {
      l.stake = roundStake((1 / l.odds) / implied * totalStake);
    });
  } else {
    // One leg is fixed, calc others from its implied share
    const fi = parseInt(fixedLeg);
    const fixedStake = legs[fi].stake;
    const fixedOdds  = legs[fi].odds;
    const totalFromFixed = fixedStake * fixedOdds; // expected payout
    legs.forEach((l, i) => {
      if (i !== fi) {
        l.stake = roundStake(totalFromFixed / l.odds);
      }
    });
  }

  renderAll();
}

// ── Profit per leg ─────────────────────────────────────────
function legProfit(legIdx) {
  const totalIn = legs.reduce((s, l) => s + l.stake, 0);
  const payout  = legs[legIdx].stake * legs[legIdx].odds;
  return payout - totalIn;
}

function minPayout() {
  return Math.min(...legs.map(l => l.stake * l.odds));
}

// ── Render ─────────────────────────────────────────────────
function renderAll() {
  renderDesktop();
  renderMobile();
  renderSummary();
}

function renderDesktop() {
  const tbody = document.getElementById('legsBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const profit = legProfit(i);
    const profitCls = profit > 0.05 ? 'profit-pos' : profit < -0.05 ? 'profit-neg' : 'profit-zero';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="leg-num">${i+1}</td>
      <td>
        <div style="font-size:0.7rem;color:#5c9eff;margin-bottom:2px;">${leg.bm || ''}</div>
        <div style="font-size:0.68rem;color:#888;margin-bottom:4px;">${leg.label}</div>
        <div class="odds-wrap">
          <button class="odds-btn" onclick="changeOdds(${i},-0.01)">−</button>
          <input type="number" class="odds-input" value="${leg.odds.toFixed(2)}" min="1.01" step="0.01"
            onchange="setOdds(${i}, this.value)" oninput="setOdds(${i}, this.value)">
          <button class="odds-btn" onclick="changeOdds(${i},+0.01)">+</button>
        </div>
      </td>
      <td>
        <input type="number" class="stake-input" value="${leg.stake}" min="0" step="1"
          onchange="setStake(${i}, this.value)" oninput="setStake(${i}, this.value)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d">
        <input type="checkbox" ${leg.d ? 'checked' : ''} onchange="setD(${i}, this.checked)">
      </td>
      <td class="col-f">
        <input type="radio" name="fixed" value="${i}" ${fixedLeg == i ? 'checked' : ''}
          onchange="setFixed('${i}')">
      </td>
      <td class="col-profit ${profitCls}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}</td>
      <td><button class="remove-btn" onclick="removeLeg(${i})">✕</button></td>
    `;
    tbody.appendChild(tr);
  });

  // Sync total
  const totalStakeEl = document.getElementById('totalStake');
  if (fixedLeg === 'total' && totalStakeEl) {
    totalStakeEl.value = legs.reduce((s, l) => s + l.stake, 0);
  }
  const totalF = document.getElementById('totalF');
  if (totalF) totalF.checked = (fixedLeg === 'total');

  const totalProfit = minPayout() - legs.reduce((s, l) => s + l.stake, 0);
  const totalProfitEl = document.getElementById('totalProfit');
  if (totalProfitEl) {
    totalProfitEl.textContent = (totalProfit >= 0 ? '+' : '') + totalProfit.toFixed(2);
    totalProfitEl.className = 'col-profit ' + (totalProfit > 0.05 ? 'profit-pos' : totalProfit < -0.05 ? 'profit-neg' : 'profit-zero');
  }
}

function renderMobile() {
  const container = document.getElementById('mobileLegs');
  if (!container) return;
  container.innerHTML = '';

  legs.forEach((leg, i) => {
    const profit = legProfit(i);
    const profitCls = profit > 0.05 ? 'profit-pos' : profit < -0.05 ? 'profit-neg' : 'profit-zero';

    const card = document.createElement('div');
    card.className = 'leg-card';
    card.innerHTML = `
      <div class="leg-card-header">
        <div>
          <div class="leg-card-title">Leg ${i+1}${leg.bm ? ' — ' + leg.bm : ''}</div>
          ${leg.label ? `<div style="font-size:0.72rem;color:#aaa;margin-top:2px;">${leg.label}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <span class="leg-card-profit ${profitCls}">${profit >= 0 ? '+' : ''}${profit.toFixed(2)}</span>
          <button class="remove-btn" onclick="removeLeg(${i})">✕</button>
        </div>
      </div>

      <div class="leg-card-row">
        <span class="leg-card-label">Odds</span>
        <div class="odds-wrap" style="flex:1">
          <button class="odds-btn" onclick="changeOdds(${i},-0.01)">−</button>
          <input type="number" style="flex:1;background:#0a1e3d;border:1.5px solid #3a5a9a;border-radius:8px;padding:8px 10px;font-size:0.9rem;color:#fff;outline:none;"
            value="${leg.odds.toFixed(2)}" min="1.01" step="0.01"
            onchange="setOdds(${i}, this.value)" oninput="setOdds(${i}, this.value)">
          <button class="odds-btn" onclick="changeOdds(${i},+0.01)">+</button>
        </div>
      </div>

      <div class="leg-card-row">
        <span class="leg-card-label">Inzet</span>
        <input type="number" value="${leg.stake}" min="0" step="1"
          onchange="setStake(${i}, this.value)" oninput="setStake(${i}, this.value)">
        <span class="currency">EUR</span>
      </div>

      <div class="df-row">
        <label class="df-item">
          <input type="checkbox" ${leg.d ? 'checked' : ''} onchange="setD(${i}, this.checked)"> D
        </label>
        <label class="df-item">
          <input type="radio" name="fixedMob" value="${i}" ${fixedLeg == i ? 'checked' : ''}
            onchange="setFixed('${i}')"> F
        </label>
      </div>
    `;
    container.appendChild(card);
  });

  // Sync totaal mobiel
  const totalStakeMob = document.getElementById('totalStakeMob');
  if (totalStakeMob && fixedLeg === 'total') {
    totalStakeMob.value = legs.reduce((s, l) => s + l.stake, 0);
  }
  const totalFMob = document.getElementById('totalFMob');
  if (totalFMob) totalFMob.checked = (fixedLeg === 'total');

  const totalProfit = minPayout() - legs.reduce((s, l) => s + l.stake, 0);
  const totalProfitMob = document.getElementById('totalProfitMob');
  if (totalProfitMob) {
    totalProfitMob.textContent = (totalProfit >= 0 ? '+' : '') + totalProfit.toFixed(2) + ' EUR';
    totalProfitMob.className = totalProfit > 0.05 ? 'profit-pos' : totalProfit < -0.05 ? 'profit-neg' : 'profit-zero';
    totalProfitMob.style.cssText = 'margin-left:auto;font-size:0.9rem;font-weight:700;';
  }
}

function renderSummary() {
  const totalIn  = legs.reduce((s, l) => s + l.stake, 0);
  const minPay   = minPayout();
  const profit   = minPay - totalIn;
  const pct      = totalIn > 0 ? (profit / totalIn * 100) : 0;

  document.getElementById('sumTotal').textContent  = '€' + totalIn.toFixed(0);
  document.getElementById('sumPayout').textContent = '€' + minPay.toFixed(2);
  document.getElementById('sumProfit').textContent = (profit >= 0 ? '+€' : '-€') + Math.abs(profit).toFixed(2);
  document.getElementById('sumPct').textContent    = (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';

  const profitEl = document.getElementById('sumProfit');
  const pctEl    = document.getElementById('sumPct');
  profitEl.className = 'sum-value ' + (profit > 0.05 ? 'sum-green' : profit < -0.05 ? 'sum-red' : 'sum-white');
  pctEl.className    = 'sum-value ' + (pct    > 0.05 ? 'sum-green' : pct    < -0.05 ? 'sum-red' : 'sum-white');
}

// ── Actions ────────────────────────────────────────────────
function setOdds(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v >= 1.01) { legs[i].odds = v; recalc(); }
}

function changeOdds(i, delta) {
  legs[i].odds = Math.max(1.01, Math.round((legs[i].odds + delta) * 100) / 100);
  recalc();
}

function setStake(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v >= 0) {
    legs[i].stake = v;
    fixedLeg = String(i);
    recalc();
  }
}

function setD(i, checked) { legs[i].d = checked; recalc(); }

function setFixed(val) {
  fixedLeg = val;
  if (val === 'total') {
    // sync stake
    const ts = document.getElementById('totalStake') || document.getElementById('totalStakeMob');
    if (ts) document.getElementById('totalStake') && (document.getElementById('totalStake').value = ts.value);
  }
  recalc();
}

function addLeg() {
  legs.push({ odds: 2.00, label: `Leg ${legs.length+1}`, bm: '', d: true, stake: 0 });
  recalc();
}

function removeLeg(i) {
  if (legs.length <= 2) return;
  legs.splice(i, 1);
  if (fixedLeg != 'total' && parseInt(fixedLeg) >= legs.length) fixedLeg = 'total';
  recalc();
}

// Total stake input handlers
document.getElementById('totalStake')?.addEventListener('change', function() {
  if (fixedLeg !== 'total') { fixedLeg = 'total'; }
  recalc();
});
document.getElementById('totalStakeMob')?.addEventListener('change', function() {
  const ts = document.getElementById('totalStake');
  if (ts) ts.value = this.value;
  if (fixedLeg !== 'total') { fixedLeg = 'total'; }
  recalc();
});
document.getElementById('totalD')?.addEventListener('change', function() { recalc(); });
document.getElementById('totalF')?.addEventListener('change', function() {
  if (this.checked) { fixedLeg = 'total'; recalc(); }
});
document.getElementById('totalDMob')?.addEventListener('change', function() { recalc(); });
document.getElementById('totalFMob')?.addEventListener('change', function() {
  if (this.checked) { fixedLeg = 'total'; recalc(); }
});

// ── Init ───────────────────────────────────────────────────
document.getElementById('totalStake').value = stakeParam;
recalc();
</script>
</body>
