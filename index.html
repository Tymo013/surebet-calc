<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 30px 16px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 28px;
      width: 100%;
      max-width: 700px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.3rem; color: #00c853; margin-bottom: 4px; }
    .match { font-size: 0.85rem; color: #aaa; margin-bottom: 20px; }

    /* TABLE */
    .calc-table { width: 100%; border-collapse: collapse; }
    .calc-table th {
      font-size: 0.72rem; color: #888; text-align: center;
      padding: 0 6px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 6px 4px; vertical-align: middle; }

    /* leg row */
    .leg-num {
      font-size: 0.75rem; color: #aaa;
      width: 22px; text-align: right; padding-right: 6px;
    }
    .odds-wrap { display: flex; align-items: center; gap: 4px; }
    .odds-btn {
      background: #0f3460; border: 1px solid #2a2a5a; color: #aaa;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 1rem; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .odds-btn:hover { border-color: #00c853; color: #00c853; }

    input[type="number"] {
      background: #0f3460; border: 1px solid #2a2a5a; color: #fff;
      border-radius: 6px; padding: 6px 8px; font-size: 0.9rem;
      outline: none; transition: border .2s; -moz-appearance: textfield;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus { border-color: #00c853; }
    .odds-input { width: 80px; }
    .stake-input { width: 90px; text-align: right; }

    .currency { font-size: 0.75rem; color: #888; padding-left: 2px; }

    /* D / F columns */
    .col-d, .col-f { width: 40px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] {
      width: 16px; height: 16px; cursor: pointer; accent-color: #00c853;
    }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 80px; text-align: right; font-size: 0.9rem; }
    .profit-pos { color: #00c853; font-weight: 600; }
    .profit-neg { color: #ff5555; }
    .profit-zero { color: #888; }

    /* separator */
    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }

    /* total row */
    .total-label {
      font-size: 0.8rem; color: #aaa; text-align: right;
      padding-right: 6px; font-weight: 600;
    }

    /* remove leg */
    .remove-btn {
      background: none; border: none; color: #ff5555;
      cursor: pointer; font-size: 1rem; padding: 0 4px; opacity: .6;
    }
    .remove-btn:hover { opacity: 1; }

    /* add leg */
    .add-leg {
      margin-top: 14px; background: none; border: 1px dashed #444;
      color: #aaa; width: 100%; padding: 7px; border-radius: 8px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; }

    /* summary */
    .summary {
      margin-top: 18px; background: #0f3460;
      border-radius: 10px; padding: 16px;
      display: flex; gap: 12px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 100px; }
    .sum-label { font-size: 0.7rem; color: #888; margin-bottom: 3px; }
    .sum-value { font-size: 1.15rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    /* tooltip */
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }
    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="matchLabel"></div>

  <table class="calc-table">
    <thead>
      <tr>
        <th style="width:22px"></th>
        <th class="left" style="min-width:90px">Odds</th>
        <th style="width:100px">Inzet</th>
        <th style="width:20px"></th>
        <th class="col-d">
          <div class="th-icon">D <span class="tip" title="Distribute: herbereken automatisch bij wijziging">?</span></div>
        </th>
        <th class="col-f">
          <div class="th-icon">F <span class="tip" title="Fixed: houd deze inzet vast bij herberekening">?</span></div>
        </th>
        <th class="col-profit">Winst</th>
        <th style="width:24px"></th>
      </tr>
    </thead>
    <tbody id="legsBody"></tbody>
    <tbody>
      <tr class="sep">
        <td colspan="2" class="total-label">Totale inzet:</td>
        <td>
          <input type="number" class="stake-input" id="totalStake" value="100" min="0" step="1">
        </td>
        <td class="currency">EUR</td>
        <td class="col-d">
          <input type="checkbox" id="totalD" checked title="Herverdeel totaal over legs">
        </td>
        <td class="col-f">
          <input type="radio" name="fixed" value="total" id="totalF">
        </td>
        <td class="col-profit" id="totalProfit">—</td>
        <td></td>
      </tr>
    </tbody>
  </table>

  <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>

  <div class="summary" id="summary"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────
let legs = [];
let fixedTarget = 'total'; // 'total' | index (number)

// ── URL params ────────────────────────────────────────────
function parseURL() {
  const p = new URLSearchParams(window.location.search);
  const match = p.get('match');
  if (match) document.getElementById('matchLabel').textContent = decodeURIComponent(match);

  const stake = p.get('stake');
  if (stake) document.getElementById('totalStake').value = stake;

  const oddsStr   = p.get('odds');
  const labelsStr = p.get('labels');
  const bmsStr    = p.get('bms');

  if (oddsStr) {
    const odds   = oddsStr.split(',');
    const labels = labelsStr ? decodeURIComponent(labelsStr).split('|') : [];
    const bms    = bmsStr    ? decodeURIComponent(bmsStr).split('|')    : [];
    legs = odds.map((o, i) => ({
      odds:      parseFloat(o) || 2.0,
      label:     labels[i] || `Uitkomst ${i + 1}`,
      bookmaker: bms[i]    || '',
      stake:     0,
      fixed:     false,
    }));
  } else {
    legs = [
      { odds: 2.0, label: 'Uitkomst 1', bookmaker: '', stake: 0, fixed: false },
      { odds: 2.0, label: 'Uitkomst 2', bookmaker: '', stake: 0, fixed: false },
    ];
  }

  renderLegs();
  calculate();
}

// ── Add / remove ──────────────────────────────────────────
function addLeg() {
  legs.push({ odds: 2.0, label: `Uitkomst ${legs.length + 1}`, bookmaker: '', stake: 0, fixed: false });
  renderLegs();
  calculate();
}

function removeLeg(i) {
  legs.splice(i, 1);
  if (fixedTarget === i) fixedTarget = 'total';
  else if (typeof fixedTarget === 'number' && fixedTarget > i) fixedTarget--;
  renderLegs();
  calculate();
}

// ── Render ────────────────────────────────────────────────
function renderLegs() {
  const tbody = document.getElementById('legsBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const desc = [leg.bookmaker, leg.label].filter(Boolean).join(' — ');
    const row = document.createElement('tr');
    row.innerHTML = `
      <td class="leg-num">${i + 1}</td>
      <td>
        <div class="odds-wrap">
          <button class="odds-btn" onclick="changeOdds(${i},-0.01)">−</button>
          <input type="number" class="odds-input" step="0.01" min="1.01"
            value="${leg.odds.toFixed(3)}"
            onchange="legs[${i}].odds=parseFloat(this.value)||1.01; calculate()"
            oninput="legs[${i}].odds=parseFloat(this.value)||1.01; calculate()">
          <button class="odds-btn" onclick="changeOdds(${i},+0.01)">+</button>
        </div>
        ${desc ? `<div style="font-size:.7rem;color:#777;margin-top:2px">${desc}</div>` : ''}
      </td>
      <td>
        <input type="number" class="stake-input" step="1" min="0"
          value="${leg.stake || ''}"
          onchange="onStakeChange(${i}, this.value)"
          oninput="onStakeChange(${i}, this.value)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d">
        <input type="checkbox" checked disabled title="Alle legs worden herberekend">
      </td>
      <td class="col-f">
        <input type="radio" name="fixed" value="${i}"
          ${fixedTarget === i ? 'checked' : ''}
          onchange="setFixed(${i})">
      </td>
      <td class="col-profit" id="legProfit${i}">—</td>
      <td>${legs.length > 2 ? `<button class="remove-btn" onclick="removeLeg(${i})">✕</button>` : ''}</td>
    `;
    tbody.appendChild(row);
  });

  // Sync totalF radio
  document.getElementById('totalF').checked = (fixedTarget === 'total');
}

function changeOdds(i, delta) {
  legs[i].odds = Math.max(1.01, Math.round((legs[i].odds + delta) * 1000) / 1000);
  renderLegs();
  calculate();
}

function setFixed(target) {
  fixedTarget = target;
  renderLegs();
  calculate();
}

// ── Stake change ──────────────────────────────────────────
function onStakeChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v)) return;
  legs[i].stake = v;

  // Als deze leg fixed is, herbereken de rest op basis van de ingevoerde stake
  if (fixedTarget === i) {
    redistributeFromFixed(i, v);
  } else {
    // Geen fixed leg — update totaal
    const total = legs.reduce((s, l) => s + (l.stake || 0), 0);
    document.getElementById('totalStake').value = Math.round(total);
    updateProfits();
    updateSummary();
  }
}

// ── Core calculation ──────────────────────────────────────
function calculate() {
  const totalInput = parseFloat(document.getElementById('totalStake').value) || 100;
  const valid = legs.filter(l => l.odds > 1.0);
  if (valid.length < 2) { clearResults(); return; }

  const impliedSum = valid.reduce((s, l) => s + 1 / l.odds, 0);

  if (fixedTarget === 'total') {
    // Distribueer totaal over alle legs proportioneel
    legs.forEach(l => {
      l.stake = Math.round((totalInput / impliedSum) * (1 / l.odds));
    });
  } else if (typeof fixedTarget === 'number') {
    // Één leg is fixed — herbereken op basis van die stake
    const fixedLeg = legs[fixedTarget];
    if (!fixedLeg || !fixedLeg.stake) return;
    redistributeFromFixed(fixedTarget, fixedLeg.stake);
    return;
  }

  // Sync stake inputs
  legs.forEach((l, i) => {
    const el = document.querySelector(`#legsBody tr:nth-child(${i + 1}) .stake-input`);
    if (el) el.value = l.stake;
  });

  updateProfits();
  updateSummary();
}

function redistributeFromFixed(fixedIdx, fixedStake) {
  const fixedLeg = legs[fixedIdx];
  if (!fixedLeg) return;
  // Bepaal implied ratio voor de fixed leg
  const fixedImplied = 1 / fixedLeg.odds;
  // Totaal implied = fixedStake / fixedImplied
  const impliedTotal = fixedStake / fixedImplied;

  legs.forEach((l, i) => {
    if (i === fixedIdx) {
      l.stake = fixedStake;
    } else {
      l.stake = Math.round(impliedTotal * (1 / l.odds));
    }
  });

  const total = legs.reduce((s, l) => s + l.stake, 0);
  document.getElementById('totalStake').value = total;

  // Sync inputs
  legs.forEach((l, i) => {
    const el = document.querySelector(`#legsBody tr:nth-child(${i + 1}) .stake-input`);
    if (el) el.value = l.stake;
  });

  updateProfits();
  updateSummary();
}

function updateProfits() {
  const totalIn = legs.reduce((s, l) => s + (l.stake || 0), 0);
  legs.forEach((l, i) => {
    const payout  = (l.stake || 0) * l.odds;
    const profit  = payout - totalIn;
    const el = document.getElementById(`legProfit${i}`);
    if (!el) return;
    el.textContent = profit.toFixed(2);
    el.className = 'col-profit ' + (profit > 0.01 ? 'profit-pos' : profit < -0.01 ? 'profit-neg' : 'profit-zero');
  });
}

function updateSummary() {
  const totalIn  = legs.reduce((s, l) => s + (l.stake || 0), 0);
  const impliedSum = legs.filter(l => l.odds > 1).reduce((s, l) => s + 1 / l.odds, 0);
  const minPayout  = Math.min(...legs.map(l => (l.stake || 0) * l.odds));
  const profit     = minPayout - totalIn;
  const profitPct  = impliedSum > 0 ? ((1 / impliedSum) - 1) * 100 : 0;

  const color = profit >= 0 ? 'sum-green' : 'sum-red';

  document.getElementById('totalProfit').textContent = profit.toFixed(2);
  document.getElementById('totalProfit').className   = 'col-profit ' + color;

  document.getElementById('summary').innerHTML = `
    <div class="sum-item">
      <div class="sum-label">Totale inzet</div>
      <div class="sum-value sum-white">€${totalIn.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white">€${minPayout.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Gegarandeerde winst</div>
      <div class="sum-value ${color}">€${profit.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winstpercentage</div>
      <div class="sum-value ${color}">${profitPct.toFixed(2)}%</div>
    </div>
  `;
}

function clearResults() {
  document.getElementById('summary').innerHTML =
    '<div style="color:#888;font-size:.85rem">Vul minimaal 2 geldige odds in.</div>';
}

// ── Event listeners ───────────────────────────────────────
document.getElementById('totalStake').addEventListener('input', function() {
  if (fixedTarget === 'total') calculate();
});

document.getElementById('totalF').addEventListener('change', function() {
  if (this.checked) { fixedTarget = 'total'; calculate(); }
});

// ── Init ──────────────────────────────────────────────────
parseURL();
</script>
</body>
</html>
