<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    .odds-wrap { display: flex; align-items: center; gap: 3px; }
    .odds-btn {
      background: #0f3460; border: 1px solid #2a4a7a; color: #aaa;
      width: 22px; height: 22px; border-radius: 4px; cursor: pointer;
      font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .odds-btn:hover { border-color: #00c853; color: #00c853; }

    input[type="number"] {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
      -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    input[type="number"]:hover:not(:focus) {
      border-color: #5c9eff;
    }
    .odds-input  { width: 72px; }
    .stake-input { width: 80px; text-align: right; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #00c853; }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 72px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .remove-btn { background: none; border: none; color: #ff5555; cursor: pointer; font-size: 1rem; padding: 0 3px; opacity: .6; }
    .remove-btn:hover { opacity: 1; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e3a6a;
    }
    .leg-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .leg-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .leg-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .leg-card-row input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    .leg-card-row .odds-wrap { flex: 1; }
    .leg-card-row .odds-wrap input[type="number"] {
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
    }

    .df-row {
      display: flex; gap: 16px; align-items: center;
      padding: 8px 10px;
      background: #0a1e3d;
      border-radius: 8px;
      border: 1px solid #1e3a6a;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input { width: 16px; height: 16px; accent-color: #00c853; cursor: pointer; }
    .df-item input[type="radio"] { accent-color: #2196f3; }

    /* Total card op mobiel */
    .total-card {
      background: #0d2545;
      border: 1.5px solid #5c9eff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(92,158,255,0.1);
    }
    .total-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a6a;
    }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .total-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .total-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .total-card-row input[type="number"]:focus {
      border-color: #5c9eff;
      box-shadow: 0 0 0 2px rgba(92,158,255,0.15);
    }

    /* Add leg */
    .add-leg {
      margin-top: 12px; background: none; border: 1.5px dashed #3a5a9a;
      color: #7a9acc; width: 100%; padding: 10px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; background: rgba(0,200,83,0.05); }

    /* Summary */
    .summary {
      margin-top: 16px;
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 16px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label {
      font-size: 0.68rem; color: #7a9acc; margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    /* ── BREAKPOINT ── */
    @media (max-width: 600px) {
      body { padding: 10px 8px; }
      .card { padding: 14px 12px; border-radius: 12px; }
      .desktop-view { display: none !important; }
      .mobile-view  { display: block !important; }
      h1 { font-size: 1rem; }
      .match  { font-size: 0.78rem; }
      .market { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="matchName"></div>
  <div class="market" id="marketName"></div>

  <!-- DESKTOP -->
  <div class="desktop-view">
    <div class="table-wrap">
      <table class="calc-table">
        <thead>
          <tr>
            <th class="left" colspan="2">Odds</th>
            <th class="left" colspan="3">Inzet</th>
            <th><div class="th-icon">D <span class="tip" title="Distribute: inzet wordt automatisch herberekend">?</span></div></th>
            <th><div class="th-icon">F <span class="tip" title="Fixed: deze inzet blijft vast staan">?</span></div></th>
            <th>Winst</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="legsDesktop"></tbody>
        <tfoot id="footDesktop"></tfoot>
      </table>
    </div>
  </div>

  <!-- MOBILE -->
  <div class="mobile-view">
    <div id="legsMobile"></div>
    <div id="totalMobile"></div>
  </div>

  <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>

  <div class="summary" id="summary"></div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let legs = [];
let fixedTarget = 'total'; // 'total' | 0 | 1 | ...
let totalStake  = 100;
let isTyping    = false; // voorkomt cursor-reset tijdens typen

// ── URL Params ─────────────────────────────────────────────────────────────
(function initFromUrl() {
  const p = new URLSearchParams(location.search);
  if (p.get('match'))  document.getElementById('matchName').textContent  = p.get('match');
  if (p.get('market')) document.getElementById('marketName').textContent = p.get('market');

  const oddsArr   = (p.get('odds')   || '2,2').split(',').map(Number);
  const labelsArr = (p.get('labels') || '').split('|');
  const bmsArr    = (p.get('bms')    || '').split('|');
  totalStake      = parseFloat(p.get('stake') || 100);

  oddsArr.forEach((o, i) => {
    legs.push({ odds: o || 2, label: labelsArr[i] || `Uitkomst ${i+1}`, bm: bmsArr[i] || '' });
  });
  if (legs.length < 2) legs.push({ odds: 2, label: 'Uitkomst 2', bm: '' });
})();

// ── Berekening ─────────────────────────────────────────────────────────────
function calc() {
  const odds = legs.map(l => l.odds);

  // Implied sum vanuit ruwe odds (NIET afgeronde stakes)
  const implied = odds.reduce((s, o) => s + (o > 1 ? 1/o : 0), 0);

  // Theoretisch rendement altijd vanuit ruwe odds
  const profitPct = implied < 1 ? ((1 / implied) - 1) * 100 : 0;

  // Payout bij totale inzet
  const payout = implied > 0 ? totalStake / implied : 0;

  // Stakes per leg (onafgerond voor berekening)
  const rawStakes = odds.map(o => o > 1 ? (totalStake / (o * implied)) : 0);

  // Afgeronde stakes voor weergave
  const roundedStakes = rawStakes.map(s => Math.round(s));

  // Winst per leg = payout - totalStake (theoretisch)
  const legProfits = odds.map(o => o > 1 ? (payout - totalStake) : 0);

  return { implied, profitPct, payout, rawStakes, roundedStakes, legProfits, totalStake };
}

// ── Render ─────────────────────────────────────────────────────────────────
function render() {
  const { profitPct, payout, roundedStakes, legProfits, totalStake: ts } = calc();
  const focused = document.activeElement;

  renderDesktop(roundedStakes, legProfits, profitPct, payout, ts, focused);
  renderMobile(roundedStakes, legProfits, profitPct, payout, ts, focused);
  renderSummary(profitPct, payout, ts);
}

function renderDesktop(roundedStakes, legProfits, profitPct, payout, ts, focused) {
  const tbody = document.getElementById('legsDesktop');
  const tfoot = document.getElementById('footDesktop');

  // ── Bewaar gefocuste input info ──
  const focusedId   = focused ? focused.id   : null;
  const focusSel    = focused ? focused.selectionStart : null;
  const focusSelEnd = focused ? focused.selectionEnd   : null;

  tbody.innerHTML = '';
  legs.forEach((leg, i) => {
    const profit = legProfits[i];
    const cls    = profit > 0.005 ? 'profit-pos' : profit < -0.005 ? 'profit-neg' : 'profit-zero';
    const isFixed = fixedTarget === i;

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="leg-num">${i+1}</td>
      <td>
        <div class="odds-wrap">
          <button class="odds-btn" onclick="adjustOdds(${i},-1)">−</button>
          <input type="number" id="odds_d_${i}" class="odds-input"
            value="${leg.odds.toFixed(2)}" step="0.01" min="1.01"
            onchange="setOdds(${i}, this.value)"
            oninput="setOdds(${i}, this.value)">
          <button class="odds-btn" onclick="adjustOdds(${i},1)">+</button>
        </div>
      </td>
      <td>
        <input type="number" id="stake_d_${i}" class="stake-input"
          value="${roundedStakes[i]}" step="1" min="0"
          onchange="setStake(${i}, this.value)"
          oninput="setStake(${i}, this.value)">
      </td>
      <td><span class="currency">EUR</span></td>
      <td></td>
      <td class="col-d">
        <input type="checkbox" checked disabled>
      </td>
      <td class="col-f">
        <input type="radio" name="fixed_d" value="${i}" ${isFixed ? 'checked' : ''}
          onchange="setFixed(${i})">
      </td>
      <td class="col-profit ${cls}">€${profit.toFixed(2)}</td>
      <td>
        ${legs.length > 2 ? `<button class="remove-btn" onclick="removeLeg(${i})">×</button>` : ''}
      </td>`;
    tbody.appendChild(tr);
  });

  // ── Footer: totaalrij ──
  const totalFixed = fixedTarget === 'total';
  tfoot.innerHTML = `
    <tr class="sep">
      <td></td>
      <td class="total-label" colspan="2">Totaal inzet:</td>
      <td>
        <input type="number" id="total_d" class="stake-input"
          value="${ts}" step="1" min="1"
          onchange="setTotal(this.value)"
          oninput="setTotal(this.value)">
      </td>
      <td><span class="currency">EUR</span></td>
      <td class="col-d"><input type="checkbox" checked disabled></td>
      <td class="col-f">
        <input type="radio" name="fixed_d" value="total" ${totalFixed ? 'checked' : ''}
          onchange="setFixed('total')">
      </td>
      <td class="col-profit">
        <span style="font-size:0.78rem;color:${profitPct>0?'#00c853':'#ff5555'};font-weight:700">
          ${profitPct > 0 ? '+' : ''}${profitPct.toFixed(2)}%
        </span>
      </td>
      <td></td>
    </tr>`;

  // ── Herstel focus + cursor ──
  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el && el !== focused) {
      el.focus();
      try { el.setSelectionRange(focusSel, focusSelEnd); } catch {}
    }
  }
}

function renderMobile(roundedStakes, legProfits, profitPct, payout, ts, focused) {
  const focusedId   = focused ? focused.id   : null;
  const focusSel    = focused ? focused.selectionStart : null;
  const focusSelEnd = focused ? focused.selectionEnd   : null;

  const legDiv = document.getElementById('legsMobile');
  legDiv.innerHTML = '';

  legs.forEach((leg, i) => {
    const profit  = legProfits[i];
    const cls     = profit > 0.005 ? 'profit-pos' : profit < -0.005 ? 'profit-neg' : 'profit-zero';
    const isFixed = fixedTarget === i;
    const title   = leg.bm ? `${leg.bm} — ${leg.label}` : leg.label;

    const card = document.createElement('div');
    card.className = 'leg-card';
    card.innerHTML = `
      <div class="leg-card-header">
        <div>
          <div class="leg-card-title">Leg ${i+1}${leg.bm ? ` · ${leg.bm}` : ''}</div>
          ${leg.label ? `<div style="font-size:0.72rem;color:#aaa;margin-top:2px">${leg.label}</div>` : ''}
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="leg-card-profit ${cls}">€${profit.toFixed(2)}</span>
          ${legs.length > 2 ? `<button class="remove-btn" onclick="removeLeg(${i})">×</button>` : ''}
        </div>
      </div>
      <div class="leg-card-row">
        <span class="leg-card-label">Odds</span>
        <div class="odds-wrap" style="flex:1">
          <button class="odds-btn" onclick="adjustOdds(${i},-1)">−</button>
          <input type="number" id="odds_m_${i}" style="flex:1;background:#0a1e3d;border:1.5px solid #3a5a9a;border-radius:8px;padding:8px 10px;font-size:0.9rem;color:#fff;outline:none"
            value="${leg.odds.toFixed(2)}" step="0.01" min="1.01"
            onchange="setOdds(${i}, this.value)"
            oninput="setOdds(${i}, this.value)">
          <button class="odds-btn" onclick="adjustOdds(${i},1)">+</button>
        </div>
      </div>
      <div class="leg-card-row">
        <span class="leg-card-label">Inzet</span>
        <input type="number" id="stake_m_${i}" style="flex:1;background:#0a1e3d;border:1.5px solid #3a5a9a;border-radius:8px;padding:8px 10px;font-size:0.9rem;color:#fff;outline:none"
          value="${roundedStakes[i]}" step="1" min="0"
          onchange="setStake(${i}, this.value)"
          oninput="setStake(${i}, this.value)">
        <span class="currency">EUR</span>
      </div>
      <div class="df-row">
        <div class="df-item"><input type="checkbox" checked disabled> D</div>
        <div class="df-item">
          <input type="radio" name="fixed_m" value="${i}" ${isFixed ? 'checked' : ''}
            onchange="setFixed(${i})"> F
        </div>
      </div>`;
    legDiv.appendChild(card);
  });

  // ── Totaal kaart ──
  const totalFixed = fixedTarget === 'total';
  const totalDiv = document.getElementById('totalMobile');
  totalDiv.innerHTML = `
    <div class="total-card">
      <div class="total-card-title">Totaal inzet</div>
      <div class="total-card-row">
        <span class="total-card-label">Inzet</span>
        <input type="number" id="total_m" style="flex:1;background:#0a1e3d;border:1.5px solid #3a5a9a;border-radius:8px;padding:8px 10px;font-size:0.9rem;color:#fff;outline:none"
          value="${ts}" step="1" min="1"
          onchange="setTotal(this.value)"
          oninput="setTotal(this.value)">
        <span class="currency">EUR</span>
      </div>
      <div class="df-row">
        <div class="df-item"><input type="checkbox" checked disabled> D</div>
        <div class="df-item">
          <input type="radio" name="fixed_m" value="total" ${totalFixed ? 'checked' : ''}
            onchange="setFixed('total')"> F
        </div>
      </div>
    </div>`;

  // ── Herstel focus ──
  if (focusedId) {
    const el = document.getElementById(focusedId);
    if (el && el !== focused) {
      el.focus();
      try { el.setSelectionRange(focusSel, focusSelEnd); } catch {}
    }
  }
}

function renderSummary(profitPct, payout, ts) {
  const isGood = profitPct > 0;
  const profit  = payout - ts;
  document.getElementById('summary').innerHTML = `
    <div class="sum-item">
      <div class="sum-label">Rendement</div>
      <div class="sum-value ${isGood ? 'sum-green' : 'sum-red'}">
        ${profitPct > 0 ? '+' : ''}${profitPct.toFixed(2)}%
      </div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Totaal inzet</div>
      <div class="sum-value sum-white">€${ts.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white">€${payout.toFixed(2)}</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winst</div>
      <div class="sum-value ${isGood ? 'sum-green' : 'sum-red'}">
        ${profit >= 0 ? '+' : ''}€${profit.toFixed(2)}
      </div>
    </div>`;
}

// ── Acties ─────────────────────────────────────────────────────────────────
function setOdds(i, val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v > 1) legs[i].odds = v;
  render();
}

function adjustOdds(i, dir) {
  legs[i].odds = Math.max(1.01, Math.round((legs[i].odds + dir * 0.01) * 1000) / 1000);
  render();
}

function setFixed(target) {
  fixedTarget = target;
  render();
}

function setTotal(val) {
  const v = parseFloat(val);
  if (!isNaN(v) && v > 0) {
    totalStake = v;
    fixedTarget = 'total';
  }
  render();
}

function setStake(i, val) {
  // Leg i is nu fixed, herbereken totalStake
  const v = parseFloat(val);
  if (isNaN(v) || v <= 0) return;

  fixedTarget = i;
  const implied = legs.reduce((s, l) => s + (l.odds > 1 ? 1/l.odds : 0), 0);
  if (implied <= 0) return;

  // totalStake zodat stake[i] = v
  // v = totalStake / (odds[i] * implied) => totalStake = v * odds[i] * implied
  totalStake = v * legs[i].odds * implied;
  render();
}

function addLeg() {
  legs.push({ odds: 2, label: `Uitkomst ${legs.length + 1}`, bm: '' });
  render();
}

function removeLeg(i) {
  if (legs.length <= 2) return;
  legs.splice(i, 1);
  if (typeof fixedTarget === 'number' && fixedTarget >= legs.length) fixedTarget = 'total';
  render();
}

// ── Init ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
