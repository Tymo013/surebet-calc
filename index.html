<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surebet Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #eee;
      min-height: 100vh;
      padding: 16px 12px;
    }
    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 20px;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    h1 { font-size: 1.15rem; color: #00c853; margin-bottom: 4px; }
    .match  { font-size: 0.85rem; color: #aaa; margin-bottom: 2px; }
    .market { font-size: 0.78rem; color: #5c9eff; margin-bottom: 16px; font-style: italic; }

    /* ── DESKTOP TABLE ── */
    .desktop-view { display: block; }
    .mobile-view  { display: none; }

    .table-wrap { overflow-x: auto; }
    .calc-table { width: 100%; border-collapse: collapse; min-width: 480px; }
    .calc-table th {
      font-size: 0.70rem; color: #888; text-align: center;
      padding: 0 4px 8px; font-weight: 600; letter-spacing: .04em;
    }
    .calc-table th.left { text-align: left; }
    .calc-table td { padding: 5px 3px; vertical-align: middle; }

    .leg-num { font-size: 0.75rem; color: #aaa; width: 22px; text-align: right; padding-right: 4px; }

    input[type="number"] {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      color: #fff;
      border-radius: 6px;
      padding: 5px 6px;
      font-size: 0.85rem;
      outline: none;
      transition: border .2s, box-shadow .2s;
      -moz-appearance: textfield;
      min-width: 0;
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    input[type="number"]:hover:not(:focus) { border-color: #5c9eff; }
    input[type="number"].error {
      border-color: #ff5555;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15);
    }
    .odds-input  { width: 80px; }
    .stake-input { width: 80px; }

    .currency { font-size: 0.72rem; color: #888; padding-left: 1px; white-space: nowrap; }

    .col-d, .col-f { width: 36px; text-align: center; }
    .col-d input[type="checkbox"],
    .col-f input[type="radio"] { width: 16px; height: 16px; cursor: pointer; accent-color: #00c853; }
    .col-f input[type="radio"] { accent-color: #2196f3; }

    .col-profit { width: 80px; text-align: right; font-size: 0.85rem; white-space: nowrap; }
    .profit-pos  { color: #00c853; font-weight: 600; }
    .profit-neg  { color: #ff5555; }
    .profit-zero { color: #888; }

    .sep td { border-top: 1px solid #2a2a5a; padding-top: 10px; }
    .total-label { font-size: 0.78rem; color: #aaa; text-align: right; padding-right: 4px; font-weight: 600; }

    .th-icon { display: flex; align-items: center; justify-content: center; gap: 3px; }
    .tip {
      display: inline-block; width: 14px; height: 14px;
      background: #2a2a5a; border-radius: 50%; font-size: .65rem;
      text-align: center; line-height: 14px; cursor: help; color: #aaa;
    }

    /* ── MOBILE CARDS ── */
    .leg-card {
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .leg-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid #1e3a6a;
    }
    .leg-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .leg-card-profit { font-size: 1rem; font-weight: 700; }

    .leg-card-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
    }
    .leg-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .leg-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .leg-card-row input[type="number"]:focus {
      border-color: #00c853;
      box-shadow: 0 0 0 2px rgba(0,200,83,0.15);
    }
    .leg-card-row input[type="number"].error {
      border-color: #ff5555;
      box-shadow: 0 0 0 2px rgba(255,85,85,0.15);
    }

    .df-row {
      display: flex; gap: 16px; align-items: center;
      padding: 8px 10px;
      background: #0a1e3d;
      border-radius: 8px;
      border: 1px solid #1e3a6a;
    }
    .df-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: #aaa; }
    .df-item input { width: 16px; height: 16px; accent-color: #00c853; cursor: pointer; }
    .df-item input[type="radio"] { accent-color: #2196f3; }

    .total-card {
      background: #0d2545;
      border: 1.5px solid #5c9eff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 2px 12px rgba(92,158,255,0.1);
    }
    .total-card-title {
      font-size: 0.8rem; color: #5c9eff; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e3a6a;
    }
    .total-card-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .total-card-label {
      font-size: 0.72rem; color: #7a9acc; width: 52px; flex-shrink: 0;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
    }
    .total-card-row input[type="number"] {
      flex: 1;
      background: #0a1e3d;
      border: 1.5px solid #3a5a9a;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
    }
    .total-card-row input[type="number"]:focus {
      border-color: #5c9eff;
      box-shadow: 0 0 0 2px rgba(92,158,255,0.15);
    }

    .add-leg {
      margin-top: 12px; background: none; border: 1.5px dashed #3a5a9a;
      color: #7a9acc; width: 100%; padding: 10px; border-radius: 10px;
      cursor: pointer; font-size: 0.85rem; transition: all .2s;
    }
    .add-leg:hover { border-color: #00c853; color: #00c853; background: rgba(0,200,83,0.05); }

    .summary {
      margin-top: 16px;
      background: #0d2545;
      border: 1.5px solid #3a5a9a;
      border-radius: 12px;
      padding: 16px;
      display: flex; gap: 10px; flex-wrap: wrap;
    }
    .sum-item { flex: 1; min-width: 80px; }
    .sum-label {
      font-size: 0.68rem; color: #7a9acc; margin-bottom: 4px;
      text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600;
    }
    .sum-value { font-size: 1.05rem; font-weight: 700; }
    .sum-green { color: #00c853; }
    .sum-red   { color: #ff5555; }
    .sum-white { color: #fff; }

    .error-banner {
      background: rgba(255,85,85,0.12);
      border: 1.5px solid #ff5555;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      color: #ff8080;
      font-size: 0.82rem;
      display: none;
    }
    .error-banner.visible { display: block; }

    /* ── BREAKPOINT ── */
    @media (max-width: 600px) {
      body { padding: 10px 8px; }
      .card { padding: 14px 12px; border-radius: 12px; }
      .desktop-view { display: none !important; }
      .mobile-view  { display: block !important; }
      h1 { font-size: 1rem; }
      .match  { font-size: 0.78rem; }
      .market { font-size: 0.72rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1>⚡ Surebet Calculator</h1>
  <div class="match" id="matchName"></div>
  <div class="market" id="marketName"></div>

  <div class="error-banner" id="errorBanner"></div>

  <!-- DESKTOP -->
  <div class="desktop-view">
    <div class="table-wrap">
      <table class="calc-table" id="desktopTable">
        <thead>
          <tr>
            <th class="left" colspan="2">Odds</th>
            <th class="left" colspan="2">Inzet</th>
            <th>
              <div class="th-icon">D <span class="tip" title="Distribute: inzet wordt automatisch herberekend">?</span></div>
            </th>
            <th>
              <div class="th-icon">F <span class="tip" title="Fixed: dit bedrag blijft vast staan">?</span></div>
            </th>
            <th class="col-profit">Winst</th>
          </tr>
        </thead>
        <tbody id="desktopBody"></tbody>
      </table>
    </div>
  </div>

  <!-- MOBILE -->
  <div class="mobile-view" id="mobileView"></div>

  <button class="add-leg" onclick="addLeg()">+ Leg toevoegen</button>

  <div class="summary" id="summary">
    <div class="sum-item">
      <div class="sum-label">Rendement</div>
      <div class="sum-value sum-green" id="sumPct">—</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Totaal inzet</div>
      <div class="sum-value sum-white" id="sumTotal">—</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Min. uitbetaling</div>
      <div class="sum-value sum-white" id="sumPayout">—</div>
    </div>
    <div class="sum-item">
      <div class="sum-label">Winst</div>
      <div class="sum-value sum-green" id="sumProfit">—</div>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────
const legs = [];   // { odds, stake, label, bookmaker }
let fixedIndex = -1;  // -1 = totaal fixed, 0..n = leg index fixed
let totalStake = 100;

// ── INIT ───────────────────────────────────────────────
window.addEventListener('load', () => {
  const p = new URLSearchParams(location.search);

  // Wedstrijd & markt
  const match = p.get('match');
  const market = p.get('market');
  if (match)  document.getElementById('matchName').textContent = match;
  if (market) document.getElementById('marketName').textContent = market;

  // Legs opbouwen vanuit URL
  const oddsArr  = (p.get('odds')   || '2,2').split(',').map(Number);
  const labelsArr = (p.get('labels') || '').split('|');
  const bmsArr    = (p.get('bms')   || '').split('|');
  const stake     = parseFloat(p.get('stake')) || 100;
  totalStake = stake;

  oddsArr.forEach((o, i) => {
    legs.push({
      odds:      isNaN(o) || o <= 1 ? 2 : o,
      stake:     0,
      label:     labelsArr[i] || `Uitkomst ${i+1}`,
      bookmaker: bmsArr[i]    || `Bookmaker ${i+1}`,
    });
  });

  fixedIndex = -1; // totaal fixed standaard
  calculate();
  render();
});

// ── BEREKENING ─────────────────────────────────────────
function calculate() {
  const impliedSum = legs.reduce((s, l) => s + 1 / l.odds, 0);
  if (impliedSum >= 1 || legs.length < 2) {
    legs.forEach(l => l.stake = 0);
    return;
  }

  if (fixedIndex === -1) {
    // Totaal is fixed → verdeel over legs
    legs.forEach(l => {
      l.stake = Math.round((1 / l.odds) / impliedSum * totalStake);
    });
  } else {
    // Een leg is fixed → bereken totaal en andere legs
    const fixedLeg = legs[fixedIndex];
    // Payout van fixed leg
    const payout = fixedLeg.stake * fixedLeg.odds;
    // Andere legs: stake = payout / odds, afgerond
    legs.forEach((l, i) => {
      if (i === fixedIndex) return;
      l.stake = Math.round(payout / l.odds);
    });
    // Herbereken totaal
    totalStake = legs.reduce((s, l) => s + l.stake, 0);
  }
}

// ── RENDEMENT (altijd via odds, nooit via stakes) ──────
function getProfitPct() {
  const impliedSum = legs.reduce((s, l) => s + 1 / l.odds, 0);
  if (impliedSum >= 1) return 0;
  return (1 / impliedSum - 1) * 100;
}

// ── RENDER ─────────────────────────────────────────────
function render() {
  renderDesktop();
  renderMobile();
  renderSummary();
  renderError();
}

function renderDesktop() {
  const tbody = document.getElementById('desktopBody');
  tbody.innerHTML = '';

  legs.forEach((leg, i) => {
    const payout = leg.stake * leg.odds;
    const profit = payout - totalStake;
    const profitCls = profit > 0.01 ? 'profit-pos' : profit < -0.01 ? 'profit-neg' : 'profit-zero';

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td class="leg-num">${i+1}</td>
      <td>
        <input type="number" class="odds-input" step="0.01" min="1.01"
          value="${leg.odds}"
          onchange="onOddsChange(${i}, this.value)"
          oninput="validateOddsInput(this)">
      </td>
      <td>
        <input type="number" class="stake-input" step="1" min="0"
          value="${leg.stake}"
          onchange="onStakeChange(${i}, this.value)">
      </td>
      <td class="currency">EUR</td>
      <td class="col-d">
        <input type="checkbox" checked disabled>
      </td>
      <td class="col-f">
        <input type="radio" name="fixed" value="${i}"
          ${fixedIndex === i ? 'checked' : ''}
          onchange="onFixedChange(${i})">
      </td>
      <td class="col-profit ${profitCls}">€${profit.toFixed(2)}</td>
    `;
    tbody.appendChild(tr);
  });

  // Totaal rij
  const totalProfit = Math.min(...legs.map(l => l.stake * l.odds)) - totalStake;
  const totalProfitCls = totalProfit > 0.01 ? 'profit-pos' : totalProfit < -0.01 ? 'profit-neg' : 'profit-zero';
  const sepTr = document.createElement('tr');
  sepTr.className = 'sep';
  sepTr.innerHTML = `
    <td colspan="2" class="total-label">Totaal inzet:</td>
    <td>
      <input type="number" class="stake-input" step="1" min="1"
        value="${totalStake}"
        onchange="onTotalStakeChange(this.value)">
    </td>
    <td class="currency">EUR</td>
    <td class="col-d">
      <input type="checkbox" checked disabled>
    </td>
    <td class="col-f">
      <input type="radio" name="fixed" value="-1"
        ${fixedIndex === -1 ? 'checked' : ''}
        onchange="onFixedChange(-1)">
    </td>
    <td class="col-profit ${totalProfitCls}">€${totalProfit.toFixed(2)}</td>
  `;
  tbody.appendChild(sepTr);
}

function renderMobile() {
  const mv = document.getElementById('mobileView');
  mv.innerHTML = '';

  legs.forEach((leg, i) => {
    const payout = leg.stake * leg.odds;
    const profit = payout - totalStake;
    const profitCls = profit > 0.01 ? 'profit-pos' : profit < -0.01 ? 'profit-neg' : 'profit-zero';

    const card = document.createElement('div');
    card.className = 'leg-card';
    card.innerHTML = `
      <div class="leg-card-header">
        <div>
          <div class="leg-card-title">${leg.bookmaker}</div>
          <div style="font-size:0.72rem;color:#aaa;margin-top:2px">${leg.label}</div>
        </div>
        <div class="leg-card-profit ${profitCls}">€${profit.toFixed(2)}</div>
      </div>
      <div class="leg-card-row">
        <div class="leg-card-label">Odds</div>
        <input type="number" step="0.01" min="1.01"
          value="${leg.odds}"
          onchange="onOddsChange(${i}, this.value)"
          oninput="validateOddsInput(this)">
      </div>
      <div class="leg-card-row">
        <div class="leg-card-label">Inzet</div>
        <input type="number" step="1" min="0"
          value="${leg.stake}"
          onchange="onStakeChange(${i}, this.value)">
        <span class="currency">EUR</span>
      </div>
      <div class="df-row">
        <div class="df-item">
          <input type="checkbox" checked disabled>
          <span>D</span>
        </div>
        <div class="df-item">
          <input type="radio" name="fixed_m" value="${i}"
            ${fixedIndex === i ? 'checked' : ''}
            onchange="onFixedChange(${i})">
          <span>F</span>
        </div>
      </div>
    `;
    mv.appendChild(card);
  });

  // Totaal kaart
  const totalProfit = Math.min(...legs.map(l => l.stake * l.odds)) - totalStake;
  const totalProfitCls = totalProfit > 0.01 ? 'profit-pos' : totalProfit < -0.01 ? 'profit-neg' : 'profit-zero';
  const totalCard = document.createElement('div');
  totalCard.className = 'total-card';
  totalCard.innerHTML = `
    <div class="total-card-title">Totaal inzet</div>
    <div class="total-card-row">
      <div class="total-card-label">Inzet</div>
      <input type="number" step="1" min="1"
        value="${totalStake}"
        onchange="onTotalStakeChange(this.value)">
      <span class="currency">EUR</span>
    </div>
    <div class="df-row">
      <div class="df-item">
        <input type="checkbox" checked disabled>
        <span>D</span>
      </div>
      <div class="df-item">
        <input type="radio" name="fixed_m" value="-1"
          ${fixedIndex === -1 ? 'checked' : ''}
          onchange="onFixedChange(-1)">
        <span>F</span>
      </div>
    </div>
    <div style="margin-top:10px;font-size:0.85rem;text-align:right" class="${totalProfitCls}">
      Winst: €${totalProfit.toFixed(2)}
    </div>
  `;
  mv.appendChild(totalCard);
}

function renderSummary() {
  const impliedSum = legs.reduce((s, l) => s + 1 / l.odds, 0);
  const pct = getProfitPct();
  const minPayout = legs.length ? Math.min(...legs.map(l => l.stake * l.odds)) : 0;
  const profit = minPayout - totalStake;
  const isSure = impliedSum < 1 && legs.length >= 2;

  document.getElementById('sumPct').textContent    = isSure ? `+${pct.toFixed(2)}%` : 'Geen surebet';
  document.getElementById('sumPct').className      = `sum-value ${isSure ? 'sum-green' : 'sum-red'}`;
  document.getElementById('sumTotal').textContent  = `€${totalStake}`;
  document.getElementById('sumPayout').textContent = `€${minPayout.toFixed(2)}`;
  document.getElementById('sumProfit').textContent = `€${profit.toFixed(2)}`;
  document.getElementById('sumProfit').className   = `sum-value ${profit > 0 ? 'sum-green' : 'sum-red'}`;
}

function renderError() {
  const impliedSum = legs.reduce((s, l) => s + 1 / l.odds, 0);
  const banner = document.getElementById('errorBanner');
  if (impliedSum >= 1 && legs.length >= 2) {
    banner.textContent = `⚠️ Geen surebet — implied sum is ${(impliedSum * 100).toFixed(2)}% (moet < 100% zijn)`;
    banner.classList.add('visible');
  } else {
    banner.classList.remove('visible');
  }
}

// ── EVENTS ─────────────────────────────────────────────
function onOddsChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v <= 1) {
    legs[i].odds = 2;
  } else {
    legs[i].odds = v;
  }
  calculate();
  render();
}

function onStakeChange(i, val) {
  const v = parseFloat(val);
  if (isNaN(v) || v < 0) return;
  // Wijzig stake van deze leg maar verplaats NIET de fixed knop
  legs[i].stake = Math.round(v);
  // Herbereken alleen de andere legs op basis van de payout van leg i
  // maar alleen als leg i fixed is
  if (fixedIndex === i) {
    calculate();
  } else {
    // Niet fixed: pas alleen de waarde aan en herbereken totaal
    totalStake = legs.reduce((s, l) => s + l.stake, 0);
  }
  render();
}

function onTotalStakeChange(val) {
  const v = parseFloat(val);
  if (isNaN(v) || v <= 0) return;
  totalStake = Math.round(v);
  if (fixedIndex === -1) {
    calculate();
  }
  render();
}

function onFixedChange(idx) {
  fixedIndex = idx;
  calculate();
  render();
}

function validateOddsInput(el) {
  const v = parseFloat(el.value);
  if (isNaN(v) || v <= 1) {
    el.classList.add('error');
  } else {
    el.classList.remove('error');
  }
}

function addLeg() {
  legs.push({ odds: 2, stake: 0, label: `Uitkomst ${legs.length + 1}`, bookmaker: `Bookmaker ${legs.length + 1}` });
  calculate();
  render();
}
</script>
</body>
</html>
